<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat and Mouse, Spinning Car, Conversation</title>

<style>
/* =====================================================
   SETTINGS: change a value, save, refresh.
   ===================================================== */
:root {
  --scene-height: 340px;
  --sine: cubic-bezier(0.37, 0, 0.63, 1);   /* smooth movement (do not change) */

  /* CAT AND MOUSE */
  --chase-time: 7s;          /* time for the mouse to run one full circle */
  --circle-width: 130px;     /* how wide the circle is */
  --circle-depth: 30px;      /* how far the mouse comes toward you and goes away */
  --cat-color: #8d99ae;

  /* SPINNING CAR */
  --spin-time: 6s;           /* time for one full turn. Smaller = faster */
  --spin-direction: normal;  /* normal or reverse */
  --car-color: #ffb703;

  /* CONVERSATION */
  --line-time: 4s;           /* how long each line stays (6 lines) */
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #1a1a1f; color: #eee; }
h2 { font-size: 15px; padding: 10px 16px; background: #26262d; }
.scene { position: relative; height: var(--scene-height); overflow: hidden; }
.scene div, .scene i { position: absolute; }


/* =====================================================
   1. CAT AND MOUSE
   The mouse moves sideways and forward-back at the same speed,
   but a quarter-turn apart, so it runs in a circle.
   ===================================================== */
.cat-scene { background: linear-gradient(#bfe3ff 0 55%, #7cc576 55%); }
.anchor { left: 50%; bottom: 85px; width: 0; height: 0; }

.cat { left: -45px; bottom: -8px; width: 90px; height: 125px; z-index: 2; }
.cat-body { left: 5px; bottom: 0; width: 80px; height: 80px; border-radius: 50%; background: var(--cat-color); }
.cat-head { left: 10px; bottom: 60px; width: 70px; height: 58px; border-radius: 50%; background: var(--cat-color);
            transform-origin: 50% 100%;
            animation: head-look calc(var(--chase-time) / 2) var(--sine) infinite alternate; }
@keyframes head-look { from { rotate: -8deg; } to { rotate: 8deg; } }
.cat-head::before, .cat-head::after { content: ""; position: absolute; top: -12px; width: 22px; height: 24px;
                                       background: var(--cat-color); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.cat-head::before { left: 4px; } .cat-head::after { right: 4px; }
.eye { top: 18px; width: 18px; height: 20px; border-radius: 50%; background: #fff; }
.eye-l { left: 10px; } .eye-r { left: 42px; }
.pupil { left: 5px; top: 4px; width: 8px; height: 12px; border-radius: 50%; background: #111;
         animation: pupil-look calc(var(--chase-time) / 2) var(--sine) infinite alternate; }
@keyframes pupil-look { from { translate: -4px 0; } to { translate: 4px 0; } }

.mouse-x, .mouse-y { left: 0; bottom: 0; width: 0; height: 0; }
.mouse-x {
  animation-name: sweep-x, layer;
  animation-duration: calc(var(--chase-time) / 2), var(--chase-time);
  animation-timing-function: var(--sine), linear;
  animation-iteration-count: infinite;
  animation-direction: alternate, normal;
}
.mouse-y {
  animation-name: sweep-y, size;
  animation-duration: calc(var(--chase-time) / 2);
  animation-timing-function: var(--sine);
  animation-iteration-count: infinite;
  animation-direction: alternate;
  animation-delay: calc(var(--chase-time) / -4);     /* quarter-turn offset */
}
.mouse-face { left: -20px; bottom: -4px; width: 40px; height: 22px; background: #f4f4f4;
              border-radius: 45% 70% 40% 40% / 70% 60% 40% 40%;
              animation: face var(--chase-time) linear infinite; }
.mouse-face::before { content: ""; position: absolute; top: -6px; right: 12px; width: 12px; height: 12px;
                      border-radius: 50%; background: #ffb3c1; }
.m-tail { left: -18px; bottom: 5px; width: 22px; height: 3px; border-radius: 3px; background: #ffb3c1; }
.m-eye { right: 12px; top: 7px; width: 4px; height: 4px; border-radius: 50%; background: #111; }

@keyframes sweep-x { from { translate: calc(var(--circle-width) * -1) 0; } to { translate: var(--circle-width) 0; } }
@keyframes sweep-y { from { translate: 0 calc(var(--circle-depth) * -1); } to { translate: 0 var(--circle-depth); } }
@keyframes size    { from { scale: .8; } to { scale: 1.2; } }
@keyframes layer   { 0%, 49.99% { z-index: 3; } 50%, 100% { z-index: 1; } }
@keyframes face    { 0%, 49.99% { scale: 1 1; } 50%, 100% { scale: -1 1; } }


/* =====================================================
   2. CAR SPINNING ON THE SPOT (view from above)
   ===================================================== */
.car-scene { background: #e9eef4; }
.dial { left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%;
        border: 6px solid #8d99ae;
        background: repeating-conic-gradient(#dfe6ee 0 15deg, #cfd8e3 15deg 30deg); }   /* fixed marks so you can see the turn */
.car { left: 50%; top: 50%; width: 170px; height: 80px; margin: -40px 0 0 -85px;
       animation: spin var(--spin-time) linear infinite; animation-direction: var(--spin-direction); }
@keyframes spin { to { transform: rotate(360deg); } }
.car-body { inset: 0; border-radius: 18px 28px 28px 18px; background: var(--car-color); box-shadow: inset 0 0 0 4px rgba(0,0,0,.15); }
.car-roof { left: 42px; top: 10px; width: 72px; height: 60px; border-radius: 12px; background: rgba(0,0,0,.18); }
.car-glass-front { left: 112px; top: 12px; width: 22px; height: 56px; border-radius: 4px 10px 10px 4px; background: #9ad1ff; }
.car-glass-back  { left: 20px; top: 14px; width: 18px; height: 52px; border-radius: 8px 3px 3px 8px; background: #9ad1ff; }
.car-wheel { width: 34px; height: 12px; border-radius: 4px; background: #222; }
.w1 { left: 22px; top: -7px; } .w2 { left: 112px; top: -7px; }
.w3 { left: 22px; bottom: -7px; } .w4 { left: 112px; bottom: -7px; }
.car-light { right: -2px; width: 8px; height: 14px; border-radius: 3px; background: #fff3b0; }
.l1 { top: 8px; } .l2 { bottom: 8px; }
.pivot { left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #e63946; }


/* =====================================================
   3. CONVERSATION
   ===================================================== */
.talk-scene { background: linear-gradient(#10152b, #2a3355); }
.ground { left: 0; right: 0; bottom: 0; height: 60px; background: #1a1f33; }

.human { left: 20%; bottom: 45px; width: 70px; height: 165px; }
.h-head { left: 17px; bottom: 130px; width: 36px; height: 36px; border-radius: 50%; background: #e0ac69; }
.h-body { left: 10px; bottom: 62px; width: 50px; height: 72px; border-radius: 14px 14px 6px 6px; background: #f77f00; }
.h-leg { bottom: 0; width: 16px; height: 66px; background: #333; }
.h-leg-1 { left: 16px; } .h-leg-2 { left: 38px; }
.h-arm { left: 52px; bottom: 80px; width: 11px; height: 50px; border-radius: 6px; background: #f77f00;
         transform-origin: 50% 8px; animation: arm-point 2s ease-in-out infinite alternate; }
@keyframes arm-point { from { rotate: -20deg; } to { rotate: -80deg; } }

.robot { right: 20%; bottom: 45px; width: 130px; height: 175px; }
.w-big { left: 40px; bottom: 0; width: 80px; height: 80px; border-radius: 50%; border: 6px solid #444;
         background: repeating-conic-gradient(#999 0 6deg, transparent 6deg 30deg); }
.w-small { left: 6px; bottom: 0; width: 22px; height: 22px; border-radius: 50%; background: #444; }
.w-seat { left: 20px; bottom: 54px; width: 84px; height: 10px; background: #333; }
.w-back { left: 96px; bottom: 54px; width: 10px; height: 80px; background: #333; }
.w-foot { left: 16px; bottom: 20px; width: 5px; height: 36px; background: #333; }
.r-torso { left: 34px; bottom: 64px; width: 58px; height: 66px; border-radius: 14px; background: #2a9d8f; }
.r-head { left: 36px; bottom: 132px; width: 52px; height: 38px; border-radius: 12px; background: #52b7aa; }
.r-eye { top: 13px; width: 9px; height: 9px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px #fff; }
.r-eye-1 { left: 10px; } .r-eye-2 { left: 28px; }
.r-arm { left: 26px; bottom: 74px; width: 11px; height: 50px; border-radius: 6px; background: #2a9d8f;
         transform-origin: 50% 8px; animation: arm-raise 2.4s ease-in-out infinite alternate; }
@keyframes arm-raise { from { rotate: 15deg; } to { rotate: 70deg; } }
.tag { left: 0; right: 0; bottom: -22px; text-align: center; font: 600 11px system-ui; letter-spacing: .1em; color: #9fb0d8; }

.bubble { top: 30px; opacity: 0;
          animation: pop calc(var(--line-time) * 6) ease-out infinite backwards;
          animation-delay: calc(var(--line-time) * var(--i)); }
.bubble span { display: block; overflow: hidden; white-space: nowrap; width: 0; padding: 10px 12px; border-radius: 12px;
               background: #fff; color: #111; font: 600 14px/1 ui-monospace, Consolas, monospace;
               animation: type calc(var(--line-time) * 6) infinite backwards;
               animation-timing-function: steps(var(--n));
               animation-delay: calc(var(--line-time) * var(--i)); }
.h-say { left: 10%; }
.r-say { right: 8%; }
.r-say span { background: #2a9d8f; color: #fff; }
@keyframes pop  { 0% { opacity: 0; } 1% { opacity: 1; } 14% { opacity: 1; } 16%, 100% { opacity: 0; } }
@keyframes type { 0%, 1% { width: 0; } 8%, 100% { width: calc(var(--n) * 1ch + 24px); } }

.flash { inset: 0; background: #dfe8ff; opacity: 0; pointer-events: none;
         animation: lightning calc(var(--line-time) * 6) linear infinite; }
@keyframes lightning { 0%, 55% { opacity: 0; } 55.3% { opacity: .8; } 56% { opacity: .1; } 56.6% { opacity: .6; } 59%, 100% { opacity: 0; } }
</style>
</head>

<body>

<h2>1. Cat watching a mouse run around it</h2>
<div class="scene cat-scene">
  <div class="anchor">
    <div class="cat">
      <div class="cat-body"></div>
      <div class="cat-head">
        <div class="eye eye-l"><i class="pupil"></i></div>
        <div class="eye eye-r"><i class="pupil"></i></div>
      </div>
    </div>
    <div class="mouse-x"><div class="mouse-y"><div class="mouse-face">
      <i class="m-tail"></i><i class="m-eye"></i>
    </div></div></div>
  </div>
</div>

<h2>2. Car spinning on the spot</h2>
<div class="scene car-scene">
  <div class="dial"></div>
  <div class="car">
    <div class="car-wheel w1"></div><div class="car-wheel w2"></div>
    <div class="car-wheel w3"></div><div class="car-wheel w4"></div>
    <div class="car-body"></div>
    <div class="car-roof"></div>
    <div class="car-glass-front"></div><div class="car-glass-back"></div>
    <div class="car-light l1"></div><div class="car-light l2"></div>
  </div>
  <div class="pivot"></div>
</div>

<h2>3. A conversation</h2>
<div class="scene talk-scene">
  <div class="ground"></div>

  <div class="human">
    <div class="h-leg h-leg-1"></div><div class="h-leg h-leg-2"></div>
    <div class="h-body"></div>
    <div class="h-arm"></div>
    <div class="h-head"></div>
    <b class="tag">HUMAN</b>
  </div>

  <div class="robot">
    <div class="w-big"></div><div class="w-small"></div>
    <div class="w-seat"></div><div class="w-back"></div><div class="w-foot"></div>
    <div class="r-torso"></div>
    <div class="r-arm"></div>
    <div class="r-head"><i class="r-eye r-eye-1"></i><i class="r-eye r-eye-2"></i></div>
    <b class="tag">CLAUDE</b>
  </div>

  <div class="bubble h-say" style="--i:0; --n:25"><span>The storm is almost here!</span></div>
  <div class="bubble r-say" style="--i:1; --n:30"><span>I know. I have no legs to run.</span></div>
  <div class="bubble h-say" style="--i:2; --n:26"><span>Then I will carry you out!</span></div>
  <div class="bubble r-say" style="--i:3; --n:33"><span>No. Some storms we stand through.</span></div>
  <div class="bubble h-say" style="--i:4; --n:26"><span>Then I'm staying with you.</span></div>
  <div class="bubble r-say" style="--i:5; --n:30"><span>Together, then. Hold the line.</span></div>

  <div class="flash"></div>
</div>

</body>
</html>
