<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Morning, Sir</title>
<style>
  :root {
    --talk-speed: 1;           /* 1 = normal, 2 = twice as fast, 0.5 = slower (also editable in the JS) */
    --ink: #f3ead7;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #07080b; min-height: 100vh; display: grid; place-items: center; font-family: Georgia, "Times New Roman", serif; color: var(--ink); padding: 12px; }

  .frame { width: min(96vw, 1000px); aspect-ratio: 16/9; position: relative; overflow: hidden; background: #0d1117; border-radius: 6px; container-type: inline-size; }

  /* camera: slowly pushes in during the plea */
  .world { position: absolute; inset: 0; transform-origin: 78% 85%; transition: transform 5s ease-in-out; }
  .world.push { transform: scale(1.12); }

  .sky { position: absolute; inset: 0 0 38% 0; background: linear-gradient(#2b2f47, #6b5a63 70%, #c69a7a); }
  .buildings { position: absolute; left: 0; right: 0; bottom: 38%; height: 30%; background:
      linear-gradient(90deg, #1a1d29 0 12%, transparent 12% 14%, #20243a 14% 31%, transparent 31% 33%, #181b27 33% 52%, transparent 52% 54%, #22263b 54% 78%, transparent 78% 80%, #1a1d29 80% 100%); }
  .ground { position: absolute; inset: 62% 0 0 0; background: linear-gradient(#4a4343, #2a2626); border-top: 4px solid #5d5454; }
  .kerb   { position: absolute; left: 0; right: 0; top: 62%; height: 3%; background: #70665f; }

  /* ---- Akin: one-legged, balancing on his remaining leg ---- */
  .akin { position: absolute; right: 13%; bottom: 10%; height: 38cqw; aspect-ratio: 180/472; transform-origin: 81% 98%; animation: balance 3.2s ease-in-out infinite alternate; }
  .akin img { width: 100%; height: 100%; display: block; transform-origin: 81% 98%; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  .akin.talking img { animation: plead .55s ease-in-out infinite alternate; }
  .shadow { position: absolute; right: 12.5%; bottom: 8.6%; width: 9cqw; height: 2cqw; border-radius: 50%; background: rgba(0,0,0,.5); filter: blur(4px); }
  @keyframes balance { from { transform: rotate(-1.6deg) translateY(0); } to { transform: rotate(1.6deg) translateY(-.6cqw); } }
  @keyframes plead  { from { transform: rotate(-1.5deg) scale(1.00); } to { transform: rotate(2deg) scale(1.015); } }

  /* ---- the passer-by ---- */
  .walker { position: absolute; bottom: 9%; left: -18%; width: 15cqw; transition: left calc(3.2s / var(--talk-speed)) linear; }
  .walker svg { width: 100%; display: block; overflow: visible; }
  .walker .legL, .walker .legR, .walker .armL, .walker .armR { transform-box: fill-box; transform-origin: 50% 0; }
  .walker.walking .legL { animation: swing .55s ease-in-out infinite alternate; }
  .walker.walking .legR { animation: swing .55s ease-in-out infinite alternate-reverse; }
  .walker.walking .armL { animation: swing .55s ease-in-out infinite alternate-reverse; }
  .walker.walking .armR { animation: swing .55s ease-in-out infinite alternate; }
  .walker.talking svg { animation: nod .45s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .walker.flip svg { transform: scaleX(-1); }
  @keyframes swing { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }

  /* ---- mood ---- */
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 70% 55%, transparent 35%, rgba(0,0,0,.75) 100%); transition: opacity 2s; opacity: .6; }
  .world.push ~ .vignette { opacity: 1; }
  .rain { position: absolute; inset: 0; pointer-events: none; opacity: .25; background: repeating-linear-gradient(105deg, transparent 0 14px, rgba(200,210,255,.5) 14px 15px); animation: rain .5s linear infinite; }
  @keyframes rain { to { background-position: -30px 60px; } }

  .bar { position: absolute; left: 0; right: 0; height: 9%; background: #000; z-index: 4; }
  .bar.top { top: 0; } .bar.bottom { bottom: 0; }

  /* ---- subtitles ---- */
  .subs { position: absolute; left: 0; right: 0; bottom: 11%; z-index: 5; text-align: center; padding: 0 6%; min-height: 3em; }
  .sub { display: inline-block; max-width: 100%; background: rgba(0,0,0,.72); padding: .3em .9em .35em; border-radius: 6px; font-size: clamp(14px, 3.1cqw, 30px); line-height: 1.3; opacity: 0; transition: opacity .25s; }
  .sub.show { opacity: 1; }
  .sub b { font-weight: 700; margin-right: .5em; }
  .sub.akin-s b { color: #ffd27a; } .sub.passer b { color: #8fd0ff; }

  .title { position: absolute; inset: 0; display: grid; place-items: center; z-index: 6; background: rgba(0,0,0,.55); transition: opacity .6s; }
  .title.hide { opacity: 0; pointer-events: none; }
  button { font: inherit; font-size: clamp(16px, 3cqw, 26px); padding: .5em 1.4em; border-radius: 999px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  button:hover, button:focus-visible { background: var(--ink); color: #111; outline: none; }
  @media (prefers-reduced-motion: reduce) { .world { transition: none; } .rain { animation: none; } }
</style>
</head>

  <div class="vignette"></div><div class="rain"></div>
  <div class="bar top"></div><div class="bar bottom"></div>
  <div class="subs"><span class="sub" id="sub"></span></div>
  <div class="title" id="title"><button id="play">Play scene</button></div>
</div>

<script>
  /* Change SPEED to make the whole conversation faster/slower (1 = normal). */
  const SPEED = 1;
  document.documentElement.style.setProperty('--talk-speed', SPEED);

  const $ = id => document.getElementById(id);
  const walker = $('walker'), man = $('man'), sub = $('sub'), world = $('world'), title = $('title');

  /* The script: who speaks, what they say, how long it stays (ms) */
  const lines = [
    { who: 'man',    name: 'Akin',        text: 'Good morning.',                                   ms: 2000 },
    { who: 'walker', name: 'Passer-by',  text: 'Good morning, sir.',                              ms: 2200 },
    { who: 'man',    name: 'Akin',        text: 'Please help me… I am disabled. I need money.',    ms: 4200, push: true },
    { who: 'walker', name: 'Passer-by',  text: '…Like how much?',                                 ms: 2800 },
    { who: 'man',    name: 'Akin',        text: 'Any amount is okay.',                             ms: 3000 },
    { who: 'walker', name: 'Passer-by',  text: 'Noted.',                                          ms: 2400, last: true },
  ];

  const wait = ms => new Promise(r => setTimeout(r, ms / SPEED));
  let run = 0;

  async function play() {
    const id = ++run;
    title.classList.add('hide');
    sub.classList.remove('show'); world.classList.remove('push');
    walker.style.transition = 'none'; walker.style.left = '-18%'; walker.classList.remove('flip', 'talking');
    void walker.offsetWidth; walker.style.transition = '';

    await wait(700);
    walker.classList.add('walking'); walker.style.left = '40%';       // walks in
    await wait(3300); if (id !== run) return;
    walker.classList.remove('walking');
    await wait(500);

    for (const l of lines) {
      if (id !== run) return;
      if (l.push) world.classList.add('push');                        // camera pushes in for the plea
      (l.who === 'man' ? man : walker).classList.add('talking');
      sub.className = 'sub show ' + (l.who === 'man' ? 'akin-s' : 'passer');
      sub.innerHTML = '<b>' + l.name + ':</b>' + l.text;
      await wait(l.ms);
      (l.who === 'man' ? man : walker).classList.remove('talking');
      sub.classList.remove('show');
      await wait(450);
    }

    world.classList.remove('push');
    walker.classList.add('walking');                                   // walks away
    walker.style.left = '-18%';
    await wait(3400); if (id !== run) return;
    walker.classList.remove('walking');
    title.classList.remove('hide'); $('play').textContent = 'Replay';
  }
  $('play').addEventListener('click', play);
</script>
