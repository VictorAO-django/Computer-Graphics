<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Orbiting a Planet</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; height: auto; border: 1px solid #2a3140; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ===================== EDIT ONLY THIS OBJECT =====================
   canvasWidth / canvasHeight : canvas size in pixels
   backgroundColor : space color
   planetColor     : planet base color
   planetShade     : dark edge color for the planet's 3D shading
   moonColor       : moon color
   orbitColor      : faint orbit ring color
   trailColor      : color of the moon's trail
   starColor       : color of background stars
   ORBIT_SPEED     : radians per frame. Positive = clockwise on screen,
                     negative = counter-clockwise.
   ORBIT_RADIUS    : distance from planet centre to moon centre (pixels)
   planetRadius    : planet radius (pixels)
   moonRadius      : moon radius (pixels)
   centerX/centerY : planet position in pixels, or "center"
   startAngle      : moon's starting angle in radians
   trailLength     : number of past moon positions in the trail (0 = off)
   starCount       : number of background stars
   starMaxSize     : biggest star radius
   orbitLineWidth  : orbit ring thickness
   orbitAlpha      : orbit ring opacity (0..1)
   trailAlpha      : trail opacity at its newest end (0..1)
   shadeOffset     : light-source offset for shading, fraction of planetRadius
   shadeInnerRatio : size of the bright core gradient (fraction of planetRadius)
================================================================== */
const CONFIG = {
  canvasWidth: 800,
  canvasHeight: 600,
  backgroundColor: "#05070d",
  planetColor: "#3d8bff",
  planetShade: "#0a1f4d",
  moonColor: "#d8d8dc",
  orbitColor: "#5c6b8a",
  trailColor: "#d8d8dc",
  starColor: "#ffffff",
  ORBIT_SPEED: 0.02,
  ORBIT_RADIUS: 200,
  planetRadius: 60,
  moonRadius: 16,
  centerX: "center",
  centerY: "center",
  startAngle: 0,
  trailLength: 40,
  starCount: 90,
  starMaxSize: 1.6,
  orbitLineWidth: 1,
  orbitAlpha: 0.4,
  trailAlpha: 0.5,
  shadeOffset: 0.35,
  shadeInnerRatio: 0.1
};

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = CONFIG.canvasWidth;
canvas.height = CONFIG.canvasHeight;

const TWO_PI = Math.PI * 2;
const centerX = CONFIG.centerX === "center" ? canvas.width / 2 : CONFIG.centerX;
const centerY = CONFIG.centerY === "center" ? canvas.height / 2 : CONFIG.centerY;

let angle = CONFIG.startAngle;
let moon = { x: 0, y: 0 };
const trail = [];

// Stars are generated once so they stay still.
const stars = Array.from({ length: CONFIG.starCount }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * CONFIG.starMaxSize
}));

function update() {
  angle += CONFIG.ORBIT_SPEED;
  // Wrap after a full turn (works for either direction).
  if (angle >= TWO_PI) angle -= TWO_PI;
  if (angle < 0) angle += TWO_PI;

  // Parametric circle
  moon.x = centerX + CONFIG.ORBIT_RADIUS * Math.cos(angle);
  moon.y = centerY + CONFIG.ORBIT_RADIUS * Math.sin(angle);

  trail.push({ x: moon.x, y: moon.y });
  if (trail.length > CONFIG.trailLength) trail.shift();
}

function dot(x, y, r, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TWO_PI);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = CONFIG.backgroundColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  stars.forEach(s => dot(s.x, s.y, s.r, CONFIG.starColor, 1));

  // Orbit ring
  ctx.globalAlpha = CONFIG.orbitAlpha;
  ctx.strokeStyle = CONFIG.orbitColor;
  ctx.lineWidth = CONFIG.orbitLineWidth;
  ctx.beginPath();
  ctx.arc(centerX, centerY, CONFIG.ORBIT_RADIUS, 0, TWO_PI);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Moon trail
  trail.forEach((p, i) => {
    const t = (i + 1) / trail.length;
    dot(p.x, p.y, CONFIG.moonRadius * t, CONFIG.trailColor, CONFIG.trailAlpha * t);
  });

  // Planet with radial shading
  const R = CONFIG.planetRadius, o = R * CONFIG.shadeOffset;
  const g = ctx.createRadialGradient(centerX - o, centerY - o, R * CONFIG.shadeInnerRatio, centerX, centerY, R);
  g.addColorStop(0, CONFIG.planetColor);
  g.addColorStop(1, CONFIG.planetShade);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(centerX, centerY, R, 0, TWO_PI);
  ctx.fill();

  // Moon
  dot(moon.x, moon.y, CONFIG.moonRadius, CONFIG.moonColor, 1);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
