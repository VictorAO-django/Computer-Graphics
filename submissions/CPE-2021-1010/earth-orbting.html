<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Earth Orbiting - Stylized</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #050505; }
        canvas { border: 1px solid #222; box-shadow: 0 10px 40px rgba(0,0,0,0.9); border-radius: 8px; }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        /*
         * CONFIG: Controls all tunable parameters for the animation.
         * - ORBIT_SPEED: Radians per frame (sign determines clockwise/counter-clockwise).
         * - ORBIT_RADIUS: Distance from the center of the planet to the center of the moon.
         * - planetRadius, moonRadius: Size of the celestial bodies.
         * - planetColorBase, moonColor, backgroundColor: CSS color strings.
         * - planetX / planetY: Central point of orbit. Use a number, or "center".
         */
        const CONFIG = {
            ORBIT_SPEED: 0.015,
            ORBIT_RADIUS: 200,
            planetRadius: 75,
            moonRadius: 22,
            planetColorBase: "#00a8ff",
            planetColorGlow: "#0097e6",
            moonColor: "#f5f6fa",
            backgroundColor: "#030305",
            planetX: "center",
            planetY: "center",
            starCount: 150
        };

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const centerX = CONFIG.planetX === "center" ? canvas.width / 2 : CONFIG.planetX;
        const centerY = CONFIG.planetY === "center" ? canvas.height / 2 : CONFIG.planetY;
        
        let angle = 0;
        const FULL_CIRCLE = Math.PI * 2;

        // Generate static starfield
        const stars = [];
        for (let i = 0; i < CONFIG.starCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        function update() {
            angle += CONFIG.ORBIT_SPEED;
            if (angle >= FULL_CIRCLE) angle -= FULL_CIRCLE;
            else if (angle <= -FULL_CIRCLE) angle += FULL_CIRCLE;
        }

        function draw() {
            // Space background
            ctx.fillStyle = CONFIG.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, FULL_CIRCLE);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
                ctx.closePath();
            });

            // Draw Orbit Ring (subtle)
            ctx.beginPath();
            ctx.arc(centerX, centerY, CONFIG.ORBIT_RADIUS, 0, FULL_CIRCLE);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.closePath();

            // Planet Glow
            ctx.beginPath();
            ctx.arc(centerX, centerY, CONFIG.planetRadius + 20, 0, FULL_CIRCLE);
            let glowGrad = ctx.createRadialGradient(centerX, centerY, CONFIG.planetRadius, centerX, centerY, CONFIG.planetRadius + 20);
            glowGrad.addColorStop(0, "rgba(0, 168, 255, 0.4)");
            glowGrad.addColorStop(1, "rgba(0, 168, 255, 0)");
            ctx.fillStyle = glowGrad;
            ctx.fill();
            ctx.closePath();

            // Planet Body (Gradient for 3D effect)
            ctx.beginPath();
            ctx.arc(centerX, centerY, CONFIG.planetRadius, 0, FULL_CIRCLE);
            let planetGrad = ctx.createRadialGradient(
                centerX - CONFIG.planetRadius*0.3, centerY - CONFIG.planetRadius*0.3, 0, 
                centerX, centerY, CONFIG.planetRadius
            );
            planetGrad.addColorStop(0, "#48dbfb"); // Light reflection
            planetGrad.addColorStop(0.5, CONFIG.planetColorBase);
            planetGrad.addColorStop(1, "#023e66"); // Shadow side
            ctx.fillStyle = planetGrad;
            ctx.fill();
            ctx.closePath();

            // Calculate moon position
            const moonX = centerX + CONFIG.ORBIT_RADIUS * Math.cos(angle);
            const moonY = centerY + CONFIG.ORBIT_RADIUS * Math.sin(angle);

            // Moon Body (Gradient for 3D effect pointing toward planet)
            ctx.beginPath();
            ctx.arc(moonX, moonY, CONFIG.moonRadius, 0, FULL_CIRCLE);
            
            // Make light source come from the central planet
            let moonGrad = ctx.createLinearGradient(centerX, centerY, moonX + (moonX-centerX), moonY + (moonY-centerY));
            moonGrad.addColorStop(0, CONFIG.moonColor);
            moonGrad.addColorStop(1, "#444"); // Shadow on the far side
            
            ctx.fillStyle = moonGrad;
            ctx.fill();
            ctx.closePath();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
