<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat and Mouse</title>
<style>
  /* ====== CHANGE THE MOUSE SPEED HERE ======
     --lap = seconds the mouse takes to go once around the cat.
     Smaller number = faster mouse. (The slider below also changes it live.) */
  :root {
    --lap: 4s;
    --size: min(88vw, 62vh, 520px);
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; gap: 18px;
    padding: 20px; background: #e9d9b8; font-family: "Trebuchet MS", system-ui, sans-serif; color: #3b2a1a;
  }
  .floor {
    width: var(--size); aspect-ratio: 1; border-radius: 50%; position: relative;
    background: repeating-radial-gradient(circle, #f4e6c8 0 18px, #efdcb6 18px 36px);
    box-shadow: inset 0 0 0 6px #c9a96a, 0 14px 30px rgba(80,50,10,.25);
  }
  /* the path the mouse runs on */
  .floor::after {
    content: ""; position: absolute; inset: 14%; border-radius: 50%;
    border: 3px dashed rgba(120,80,30,.35);
  }

  /* ---------- Cat (sits in the middle, turns to watch the mouse) ---------- */
  .cat {
    position: absolute; inset: 31%; 
    animation: spin var(--lap) linear infinite;   /* same speed as the mouse so it keeps looking at it */
  }
  .cat svg { width: 100%; height: 100%; overflow: visible; }
  .tail { transform-origin: 50px 82px; animation: swish 1.1s ease-in-out infinite alternate; }
  .pupil { animation: blinkless 3s infinite; }

  /* ---------- Mouse (runs round the cat) ---------- */
  .orbit {
    position: absolute; inset: 0;
    animation: spin var(--lap) linear infinite;
  }
  .mouse {
    position: absolute; left: 50%; top: 7%; width: 11%; aspect-ratio: 1.6; translate: -50% -50%;
  }
  .mouse svg { width: 100%; height: 100%; overflow: visible; }
  .mouse .scurry { animation: scurry .18s ease-in-out infinite alternate; transform-origin: center; }

  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes swish  { from { transform: rotate(-16deg); } to { transform: rotate(18deg); } }
  @keyframes scurry { from { transform: translateY(-1.5px); } to { transform: translateY(1.5px); } }

  /* ---------- Controls ---------- */
  .controls {
    background: #fff8e8; border: 2px solid #c9a96a; border-radius: 14px; padding: 12px 18px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center;
  }
  .controls input { width: 220px; accent-color: #b8651b; }
  output { min-width: 5.5em; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) { .cat, .orbit { animation-duration: 20s; } }
</style>
</head>
<body>

<div class="floor">
  <!-- Cat: top-down view, face points UP towards the mouse -->
  <div class="cat">
    <svg viewBox="0 0 100 100">
      <g class="tail"><path d="M50 78 C 30 100, 70 105, 62 125" stroke="#d98a3d" stroke-width="9" fill="none" stroke-linecap="round"/></g>
      <ellipse cx="50" cy="62" rx="26" ry="32" fill="#e8963f"/>
      <path d="M38 48 q4 10 0 22 M50 46 v26 M62 48 q-4 10 0 22" stroke="#b86a22" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="30" cy="38" rx="7" ry="11" fill="#e8963f"/><ellipse cx="70" cy="38" rx="7" ry="11" fill="#e8963f"/>
      <polygon points="29,22 36,6 46,20" fill="#e8963f"/><polygon points="71,22 64,6 54,20" fill="#e8963f"/>
      <polygon points="33,19 37,11 42,19" fill="#f4b3a8"/><polygon points="67,19 63,11 58,19" fill="#f4b3a8"/>
      <circle cx="50" cy="27" r="22" fill="#f0a34d"/>
      <ellipse cx="41" cy="23" rx="6" ry="7.5" fill="#fff6c9"/><ellipse cx="59" cy="23" rx="6" ry="7.5" fill="#fff6c9"/>
      <ellipse class="pupil" cx="41" cy="20" rx="2.2" ry="6" fill="#222"/><ellipse class="pupil" cx="59" cy="20" rx="2.2" ry="6" fill="#222"/>
      <polygon points="46,33 54,33 50,38" fill="#e56b7a"/>
      <path d="M50 38 v3 M50 41 q-4 4 -8 1 M50 41 q4 4 8 1" stroke="#5a3418" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M34 32 l-14 -3 M34 35 l-14 3 M66 32 l14 -3 M66 35 l14 3" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Mouse: top-down view, faces RIGHT (running clockwise) -->
  <div class="orbit">
    <div class="mouse">
      <svg viewBox="0 0 80 50">
        <g class="scurry">
          <path d="M16 25 C 4 25, 6 12, -6 16" stroke="#e7a1a8" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <ellipse cx="34" cy="25" rx="22" ry="13" fill="#9a9aa6"/>
          <circle cx="40" cy="12" r="7" fill="#f0b9c0"/><circle cx="40" cy="38" r="7" fill="#f0b9c0"/>
          <path d="M50 18 L 76 25 L 50 32 Z" fill="#aeaeb9"/>
          <circle cx="76" cy="25" r="3" fill="#e56b7a"/>
          <circle cx="58" cy="21" r="1.8" fill="#111"/><circle cx="58" cy="29" r="1.8" fill="#111"/>
        </g>
      </svg>
    </div>
  </div>
</div>

<div class="controls">
  <label for="speed">Mouse speed</label>
  <input id="speed" type="range" min="0.5" max="12" step="0.1" value="4">
  <output id="out"></output>
</div>

<script>
  /* Slider: speed = laps per 10 seconds feel; internally we set --lap (seconds per lap) */
  const root = document.documentElement, slider = document.getElementById('speed'), out = document.getElementById('out');
  function update() {
    const s = parseFloat(slider.value);          // higher = faster
    const lap = (12.5 / s).toFixed(2);           // seconds per lap
    root.style.setProperty('--lap', lap + 's');
    out.textContent = s.toFixed(1) + 'x';
  }
  slider.addEventListener('input', update);
  slider.value = 3.1; update();
</script>
</body>
</html>
