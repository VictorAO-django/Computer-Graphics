<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car on a Turntable</title>
<style>
  /* ====== CHANGE THE TURNTABLE SPEED HERE ======
     --lap = seconds for one full turn of the table (smaller = faster).
     The slider below also changes it live. */
  :root {
    --lap: 6s;
    --size: min(88vw, 62vh, 520px);
  }

  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; gap: 18px; padding: 20px; background: #1b2028; font-family: "Trebuchet MS", system-ui, sans-serif; color: #e8edf3; }

  .base { width: var(--size); aspect-ratio: 1; border-radius: 50%; position: relative; background: radial-gradient(circle at 40% 35%, #3a424f, #20252e); box-shadow: 0 18px 34px rgba(0,0,0,.55), inset 0 0 0 6px #121519; display: grid; place-items: center; }

  /* the turntable plate: the car is fixed on it, so it turns the car with it */
  .table {
    width: 88%; aspect-ratio: 1; border-radius: 50%; position: relative;
    background:
      repeating-conic-gradient(from 0deg, #8d98a8 0 4deg, #7a8595 4deg 8deg);
    box-shadow: inset 0 0 0 8px #c9d1dc, inset 0 0 0 12px #55606f, 0 0 0 3px #0e1013;
    animation: turn var(--lap) linear infinite;
    display: grid; place-items: center;
  }
  .table::before { /* rings + markers so you can see the table turning */
    content: ""; position: absolute; inset: 9%; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.35);
  }
  .table::after {
    content: ""; position: absolute; left: 50%; top: 3.5%; width: 6%; aspect-ratio: 1; translate: -50% 0; border-radius: 50%; background: #ffcc33; box-shadow: 0 0 10px #ffcc33;
  }
  .car { width: 26%; aspect-ratio: .5; position: relative; z-index: 2; }
  .car svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 6px 5px rgba(0,0,0,.5)); }

  @keyframes turn { to { transform: rotate(360deg); } }

  .controls { background: #262c36; border: 2px solid #3d4756; border-radius: 14px; padding: 12px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .controls input { width: 220px; accent-color: #ffb02e; }
  output { min-width: 5.5em; font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .table { animation-duration: 30s; } }
</style>
</head>
<body>

<div class="base">
  <div class="table">
    <div class="car">
      <svg viewBox="0 0 50 100">
        <rect x="2" y="16" width="7" height="16" rx="2" fill="#0b0d10"/><rect x="41" y="16" width="7" height="16" rx="2" fill="#0b0d10"/>
        <rect x="2" y="68" width="7" height="16" rx="2" fill="#0b0d10"/><rect x="41" y="68" width="7" height="16" rx="2" fill="#0b0d10"/>
        <rect x="6" y="4" width="38" height="92" rx="14" fill="#e23b3b"/>
        <rect x="9" y="30" width="32" height="34" rx="8" fill="#8fd3ff" opacity=".9"/>
        <rect x="12" y="38" width="26" height="20" rx="5" fill="#b11f1f"/>
        <rect x="10" y="12" width="30" height="14" rx="6" fill="#c92e2e"/>
        <rect x="10" y="74" width="30" height="14" rx="6" fill="#c92e2e"/>
        <circle cx="14" cy="8" r="3" fill="#fff6b0"/><circle cx="36" cy="8" r="3" fill="#fff6b0"/>
        <rect x="10" y="92" width="8" height="3" rx="1.5" fill="#ff3030"/><rect x="32" y="92" width="8" height="3" rx="1.5" fill="#ff3030"/>
      </svg>
    </div>
  </div>
</div>

<div class="controls">
  <label for="speed">Table speed</label>
  <input id="speed" type="range" min="0.3" max="12" step="0.1" value="2">
  <output id="out"></output>
</div>

<script>
  const root = document.documentElement, slider = document.getElementById('speed'), out = document.getElementById('out');
  function update() {
    const s = parseFloat(slider.value);            // higher = faster
    root.style.setProperty('--lap', (12 / s).toFixed(2) + 's');
    out.textContent = s.toFixed(1) + 'x';
  }
  slider.addEventListener('input', update);
  update();
</script>
</body>
</html>
