<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Orbit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ---------- Scene ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000004);

  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
  camera.position.set(0, 9, 22);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // ---------- Stars ----------
  const starPositions = [];
  for (let i = 0; i < 1500; i++) {
    const v = new THREE.Vector3(
      Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
    ).normalize().multiplyScalar(200 + Math.random() * 100);
    starPositions.push(v.x, v.y, v.z);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, sizeAttenuation: false })));

  // ---------- Procedural moon texture (grey regolith, dark maria, craters) ----------
  function makeMoonTexture() {
    const w = 1024, h = 512;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');

    g.fillStyle = '#a8a6a0';
    g.fillRect(0, 0, w, h);

    // Fine grain
    for (let i = 0; i < 25000; i++) {
      const v = 130 + Math.random() * 60;
      g.fillStyle = `rgba(${v},${v - 2},${v - 6},0.25)`;
      g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    }

    // Dark basalt plains (maria), repeated across the seam so they wrap cleanly
    const maria = [
      [330, 190, 110, 70], [430, 250, 70, 50], [250, 260, 60, 45],
      [470, 160, 55, 40], [380, 300, 45, 35], [560, 220, 40, 30]
    ];
    maria.forEach(([x, y, rx, ry]) => {
      [-w, 0, w].forEach(o => {
        const grad = g.createRadialGradient(x + o, y, 0, x + o, y, rx);
        grad.addColorStop(0, 'rgba(70,70,76,0.85)');
        grad.addColorStop(0.7, 'rgba(85,85,90,0.55)');
        grad.addColorStop(1, 'rgba(90,90,95,0)');
        g.save();
        g.translate(x + o, y); g.scale(1, ry / rx); g.translate(-(x + o), -y);
        g.fillStyle = grad;
        g.beginPath(); g.arc(x + o, y, rx, 0, Math.PI * 2); g.fill();
        g.restore();
      });
    });

    // Craters
    for (let i = 0; i < 220; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      const r = 2 + Math.pow(Math.random(), 3) * 26;
      [-w, 0, w].forEach(o => {
        g.beginPath(); g.arc(x + o, y, r, 0, Math.PI * 2);
        g.fillStyle = 'rgba(60,60,60,0.35)'; g.fill();
        g.lineWidth = Math.max(1, r * 0.15);
        g.strokeStyle = 'rgba(230,228,220,0.45)'; g.stroke();
      });
    }

    return new THREE.CanvasTexture(c);
  }

  // ---------- Moon ----------
  const MOON_RADIUS = 1.5;
  const ORBIT_RADIUS = 10;

  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(MOON_RADIUS, 64, 64),
    new THREE.MeshStandardMaterial({ map: makeMoonTexture(), roughness: 1, metalness: 0 })
  );
  scene.add(moon);

  // Faint orbit path (the "invisible Earth" sits at the centre)
  const pts = [];
  for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * ORBIT_RADIUS, 0, Math.sin(a) * ORBIT_RADIUS));
  }
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x333338, transparent: true, opacity: 0.6 })
  ));

  // ---------- Light (sunlight gives the moon its phases) ----------
  const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
  sun.position.set(30, 6, 10);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x1a1a22, 0.6));

  // ---------- Animation ----------
  const ORBIT_SPEED = 0.25;   // radians per second
  const INCLINATION = 0.09;   // slight tilt of the orbit
  let angle = 0;
  let last = performance.now();

  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    angle += ORBIT_SPEED * dt;
    moon.position.set(
      Math.cos(angle) * ORBIT_RADIUS,
      Math.sin(angle) * ORBIT_RADIUS * Math.sin(INCLINATION),
      Math.sin(angle) * ORBIT_RADIUS
    );

    // Tidal locking: one face always points at the (invisible) Earth
    moon.rotation.y = -angle + Math.PI;

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
</html>
