/* ---------- background ---------- */
(function(){
  // clouds
  const cl=$('clouds');
  window.clouds=[];
  [[120,90,1],[470,60,.8],[760,120,1.15],[1100,70,.9]].forEach(([x,y,s])=>{
    const g=el('g',{},cl);
    [[0,0,60,22],[-38,8,40,16],[40,10,46,17],[8,-12,34,16]].forEach(([dx,dy,rx,ry])=>el('ellipse',{cx:dx,cy:dy,rx:rx*s,ry:ry*s,fill:'#fff',opacity:.92},g));
    clouds.push({g,x,y,sp:rnd(3,8)});
  });
  // birds
  window.birds=[];
  for(let i=0;i<4;i++){const g=el('g',{},$('birds'));const p=el('path',{d:'M-9,0 Q-4,-7 0,0 Q4,-7 9,0',fill:'none',stroke:'#2d3b3b','stroke-width':2,'stroke-linecap':'round'},g);birds.push({g,p,x:rnd(0,1280),y:rnd(60,200),sp:rnd(25,45),ph:rnd(0,6)});}
  // far hills
  const far=$('far');
  el('path',{d:'M0,420 Q150,340 330,400 T640,380 T980,395 T1280,360 L1280,460 L0,460Z',fill:'#8dba72'},far);
  el('path',{d:'M0,440 Q200,385 420,425 T820,410 T1280,420 L1280,470 L0,470Z',fill:'#74a95a'},far);

  function mango(g,x,y,s){
    el('rect',{x:x-7*s,y:y-70*s,width:14*s,height:72*s,fill:'#6b4a2e',rx:4},g);
    [[0,-100,46],[-34,-82,36],[34,-84,36],[-14,-122,34],[22,-116,32]].forEach(([dx,dy,r],i)=>el('circle',{cx:x+dx*s,cy:y+dy*s,r:r*s,fill:['#3f7d34','#478a3a','#386f2e'][i%3]},g));
  }
  function palm(g,x,y,s,lean){
    el('path',{d:`M${x},${y} Q${x+lean*s*.4},${y-90*s} ${x+lean*s},${y-170*s}`,fill:'none',stroke:'#7a5a38','stroke-width':9*s,'stroke-linecap':'round'},g);
    const tx=x+lean*s,ty=y-170*s;
    for(let i=0;i<8;i++){const a=-Math.PI+(i/7)*Math.PI;const ex=tx+Math.cos(a)*70*s,ey=ty+Math.sin(a)*35*s+30*s;
      el('path',{d:`M${tx},${ty} Q${tx+Math.cos(a)*40*s},${ty-28*s} ${ex},${ey}`,fill:'none',stroke:'#2f7a3a','stroke-width':5*s,'stroke-linecap':'round'},g);}
    el('circle',{cx:tx,cy:ty+4,r:6*s,fill:'#5a3d22'},g);
  }
  function hut(g,x,y,w,h,wall,roof,type){
    el('ellipse',{cx:x,cy:y+2,rx:w*.62,ry:8,fill:'rgba(0,0,0,.18)'},g);
    el('rect',{x:x-w/2,y:y-h,width:w,height:h,fill:wall},g);
    for(let i=0;i<5;i++)el('path',{d:`M${x-w/2},${y-h+(i+1)*h/6} h${w}`,stroke:'rgba(90,50,20,.18)','stroke-width':2},g);
    el('rect',{x:x-w/2,y:y-6,width:w,height:6,fill:'rgba(80,40,10,.25)'},g);
    const rh=h*.62;
    if(type==='zinc'){
      el('polygon',{points:`${x-w/2-12},${y-h+4} ${x},${y-h-rh} ${x+w/2+12},${y-h+4}`,fill:roof},g);
      for(let i=1;i<9;i++){const t=i/9;el('path',{d:`M${x-w/2-12+(w+24)*t},${y-h+4} L${x},${y-h-rh}`,stroke:'rgba(0,0,0,.14)','stroke-width':1.5},g);}
      el('rect',{x:x-w/2-12,y:y-h+1,width:w+24,height:5,fill:'rgba(0,0,0,.25)'},g);
    }else{
      el('polygon',{points:`${x-w/2-14},${y-h+8} ${x},${y-h-rh-6} ${x+w/2+14},${y-h+8}`,fill:roof},g);
      for(let i=0;i<14;i++){const px=x-w/2-14+(w+28)*i/13;el('path',{d:`M${px-7},${y-h+8} l7,12 l7,-12`,fill:roof,stroke:'rgba(0,0,0,.18)','stroke-width':1},g);}
    }
    el('rect',{x:x-w*.28,y:y-h*.62,width:w*.2,height:h*.62,fill:'#4a2d18',rx:2},g);
    el('rect',{x:x+w*.1,y:y-h*.72,width:w*.22,height:h*.28,fill:'#bfe2f2',stroke:'#5a3a20','stroke-width':3},g);
    el('path',{d:`M${x+w*.21},${y-h*.72} v${h*.28} M${x+w*.1},${y-h*.58} h${w*.22}`,stroke:'#5a3a20','stroke-width':2},g);
  }
  const mid=$('mid');
  // back row (smaller, higher)
  const back=el('g',{opacity:.97},mid);
  palm(back,60,462,.9,22);
  hut(back,190,468,120,70,'#d4a574','#8a5a3a','thatch');
  mango(back,330,468,.8);
  hut(back,470,466,110,66,'#e6d6bb','#9a6a40','thatch');
  palm(back,590,464,1,-26);
  hut(back,720,468,130,74,'#c98d5b','#7e7f86','zinc');
  mango(back,880,466,.85);
  hut(back,1010,466,118,70,'#dcc29c','#8a5a3a','thatch');
  palm(back,1130,464,.95,24);
  hut(back,1230,470,110,66,'#bd7e4d','#7e7f86','zinc');
  // bamboo fence
  for(let x=0;x<1290;x+=22){el('rect',{x:x,y:476,width:6,height:30,fill:'#a67c3e',rx:2},mid);}
  el('rect',{x:0,y:486,width:1280,height:4,fill:'#8a6530'},mid);
  el('rect',{x:0,y:498,width:1280,height:4,fill:'#8a6530'},mid);
  // smoke
  window.smoke=[];
  for(let i=0;i<6;i++){const c=el('circle',{r:6,fill:'#e8e8e8'},mid);smoke.push({c,t:i/6});}
  // road texture
  const rd=$('road');
  for(let i=0;i<150;i++){const x=sr()*1280,y=520+sr()*170;el('ellipse',{cx:x,cy:y,rx:2+sr()*5,ry:1+sr()*2,fill:sr()>.5?'#e4b985':'#b58450',opacity:.6},rd);}
  el('path',{d:'M0,640 C300,626 700,654 1280,630',fill:'none',stroke:'#b98a52','stroke-width':6,opacity:.35},rd);
  // front greenery
  const fr=$('front');
  for(let i=0;i<70;i++){const x=sr()*1300-10,y=700+sr()*22,h=10+sr()*16;
    el('path',{d:`M${x},${y} q-3,-${h*.6} -6,-${h} M${x},${y} q0,-${h*.7} 1,-${h*1.1} M${x},${y} q3,-${h*.6} 7,-${h*.9}`,fill:'none',stroke:sr()>.5?'#3f7a30':'#4f8e3a','stroke-width':2.4,'stroke-linecap':'round'},fr);}
  [[24,712,34],[1250,714,40],[640,716,26]].forEach(([x,y,r])=>{[0,1,2].forEach(i=>el('circle',{cx:x+(i-1)*r*.8,cy:y-(i===1?r*.4:0),r:r,fill:['#3e7d33','#4b8d3b','#35702c'][i]},fr));});
  [[110,712],[420,716],[900,714],[1170,710]].forEach(([x,y])=>{for(let i=0;i<4;i++){el('circle',{cx:x+i*7-10,cy:y-6-(i%2)*4,r:3.2,fill:pick(['#ffd23f','#ff7a59','#fff'])},fr);}});
})();

const SKIN=['#4a2e20','#6b4430','#8a5a3c','#3b261b','#5a3826'];

function makeVillager(cfg){
  const g=el('g',{});
  const H=cfg.type==='child'?100:cfg.type==='elder'?148:164;
  const skin=cfg.skin,c1=cfg.c1,c2=cfg.c2;
  const hip=-H*.48,sh=-H*.8,lw=H*.075,legL=H*.46;
  el('ellipse',{cx:0,cy:0,rx:H*.2,ry:H*.035,fill:'rgba(0,0,0,.22)'},g);

  const footB=el('ellipse',{rx:H*.06,ry:H*.025,fill:'#222'},g),footF=el('ellipse',{rx:H*.06,ry:H*.025,fill:'#222'},g);

  el('rect',{x:-H*.025,y:sh-H*.06,width:H*.05,height:H*.07,fill:skin},upper);
  const hr=cfg.type==='child'?H*.13:H*.085,hy=sh-hr-H*.045;

    ['#e34a2b','#f2b705','#3a9d4a','#e34a2b'].forEach((c,i)=>el('circle',{cx:(i-1.5)*hr*.7,cy:hy-hr*1.95,r:hr*.45,fill:c},basket));}
  const stick=cfg.type==='elder'?el('line',{stroke:'#6b4a2a','stroke-width':3,'stroke-linecap':'round'},g):null;
  const armF=el('line',{stroke:skin,'stroke-width':H*.055,'stroke-linecap':'round'},g);
  const sleeveF=el('line',{stroke:c1,'stroke-width':H*.07,'stroke-linecap':'round'},g);
  const sleeveB=armB; // reuse
  return {g,update(ph,t){
    const a=Math.sin(ph)*.55;
    const bob=-Math.abs(Math.cos(ph))*H*.012;
    upper.setAttribute('transform',`translate(0,${bob})`);

      sleeveF.setAttribute('x1',tw*.7);sleeveF.setAttribute('y1',sh+H*.02);sleeveF.setAttribute('x2',tw*.62);sleeveF.setAttribute('y2',sh-H*.08);
    }else{
      const aa=-a*.9;
      armF.setAttribute('x1',0);armF.setAttribute('y1',sh+H*.03+bob);armF.setAttribute('x2',Math.sin(aa)*al);armF.setAttribute('y2',sh+H*.03+Math.cos(aa)*al+bob);
      sleeveF.setAttribute('x1',0);sleeveF.setAttribute('y1',sh+H*.03+bob);sleeveF.setAttribute('x2',Math.sin(aa)*al*.35);sleeveF.setAttribute('y2',sh+H*.03+Math.cos(aa)*al*.35+bob);
      armB.setAttribute('x1',0);armB.setAttribute('y1',sh+H*.03+bob);armB.setAttribute('x2',-Math.sin(aa)*al);armB.setAttribute('y2',sh+H*.03+Math.cos(aa)*al+bob);
    }
    if(stick){stick.setAttribute('x1',H*.2+Math.sin(ph)*3);stick.setAttribute('y1',sh+H*.2);stick.setAttribute('x2',H*.2+Math.sin(ph)*3);stick.setAttribute('y2',0);}
  },H};
}

// crutch/arm parts
function mkCrutch(g,col,padCol){return{pole:el('line',{stroke:col,'stroke-width':6,'stroke-linecap':'round'},g),pad:el('line',{stroke:padCol,'stroke-width':8,'stroke-linecap':'round'},g),hand:el('line',{stroke:'#3a2a1a','stroke-width':6,'stroke-linecap':'round'},g),tip:el('circle',{r:4.5,fill:'#222'},g)};}
const cFar=mkCrutch(farCr,'#7a5530','#4f3a22'),cNear=mkCrutch(nearCr,'#a67a42','#6a4a2a');
function mkArm(g,sleeve,skin){return{up:el('line',{stroke:sleeve,'stroke-width':20,'stroke-linecap':'round'},g),fo:el('line',{stroke:skin,'stroke-width':11,'stroke-linecap':'round'},g),hd:el('circle',{r:6.5,fill:skin},g)};}
const aFar=mkArm(farArm,TEE_F,SKIN_F),aNear=mkArm(nearArm,TEE,SKIN_M);

function setL(l,a,b){l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);}
function drawCrutch(c,pad,tip){
  setL(c.pole,pad,tip);
  const dx=tip[0]-pad[0],dy=tip[1]-pad[1],d=Math.hypot(dx,dy),nx=-dy/d,ny=dx/d;
  setL(c.pad,[pad[0]-nx*11,pad[1]-ny*11],[pad[0]+nx*11,pad[1]+ny*11]);
  const hd=[pad[0]+dx*.37,pad[1]+dy*.37];
  setL(c.hand,[hd[0]-nx*8,hd[1]-ny*8],[hd[0]+nx*8,hd[1]+ny*8]);
  c.tip.setAttribute('cx',tip[0]);c.tip.setAttribute('cy',tip[1]);
  return hd;
}
function drawArm(a,S,Hd){
  const L1=50,L2=50;let dx=Hd[0]-S[0],dy=Hd[1]-S[1];let d=Math.hypot(dx,dy)||1;
  const dd=Math.min(d,L1+L2-1);const aa=(L1*L1-L2*L2+dd*dd)/(2*dd);const h=Math.sqrt(Math.max(0,L1*L1-aa*aa));
  const ux=dx/d,uy=dy/d,mx=S[0]+ux*aa,my=S[1]+uy*aa;
  let e1=[mx-uy*h,my+ux*h],e2=[mx+uy*h,my-ux*h];const E=e1[0]<e2[0]?e1:e2;
  const hand=d>L1+L2-1?[S[0]+ux*(L1+L2-1),S[1]+uy*(L1+L2-1)]:Hd;
  setL(a.up,S,E);setL(a.fo,E,hand);a.hd.setAttribute('cx',hand[0]);a.hd.setAttribute('cy',hand[1]);
}
function tapered(poly,x0,y0,x1,y1,w0,w1){
  const dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d;
  poly.setAttribute('points',`${x0+nx*w0},${y0+ny*w0} ${x0-nx*w0},${y0-ny*w0} ${x1-nx*w1},${y1-ny*w1} ${x1+nx*w1},${y1+ny*w1}`);
}
// state
const S=76,SW=.38,T=1.0,XMIN=150,XMAX=1130;
const st={mode:'walk',u:0,bx0:XMIN+10,dir:1,relStart:20,pauseT:0,pauseRel:20,planted:false,relLast:20,time:0};
const dust=[];
function spawnDust(x){
  for(let i=0;i<4;i++){const c=el('circle',{r:3,fill:'#e2bd8a',opacity:.8},actors);dust.push({c,x:x+rnd(-6,6),y:MY-rnd(0,4),vx:rnd(-14,14),vy:rnd(-18,-6),t:0});}
}
function updateMain(dt){
  st.time+=dt;
  let rel,tipLift=0,bx,footRel=0,footLift=0,bodyY=0,lean=2,swing=0;
  if(st.mode==='walk'){
    st.u+=dt/T;
    if(st.u>=1){
      st.u-=1;st.bx0+=st.dir*S;st.planted=false;
      if((st.dir>0&&st.bx0+S>XMAX)||(st.dir<0&&st.bx0-S<XMIN)){st.mode='pause';st.pauseT=0;st.pauseRel=50-S;}
      else st.relStart=50-S;
    }
  }
  if(st.mode==='walk'){
    const u=st.u;
    if(u<SW){const w=u/SW;rel=st.relStart+(50-st.relStart)*ease(w);tipLift=Math.sin(Math.PI*w)*22;bx=st.bx0;lean=2+Math.sin(Math.PI*w)*1.5;}
    else{
      if(!st.planted){st.planted=true;spawnDust(st.bx0+st.dir*(50)*SC);}
      const w2=(u-SW)/(1-SW),pb=ease(w2),pf=ease(Math.min(1,w2*1.3));
      bx=st.bx0+st.dir*S*pb;rel=50-S*pb;footLift=Math.sin(Math.PI*Math.min(1,w2*1.15))*17;footRel=S*(pf-pb);
      bodyY=-Math.sin(Math.PI*w2)*7;lean=2+Math.sin(Math.PI*w2)*7;swing=Math.sin(Math.PI*w2);
    }
    st.relLast=rel;
  }else{
    st.pauseT+=dt;bx=st.bx0;
    rel=st.pauseRel+(20-st.pauseRel)*ease(st.pauseT/.7);lean=0;
    if(st.pauseT>2.8){st.dir*=-1;st.mode='walk';st.u=0;st.relStart=20;st.planted=false;}
  }
  const dir=st.dir;
  M.setAttribute('transform',`translate(${bx},${MY}) scale(${dir*SC},${SC})`);
  mShadow.setAttribute('cx',0);mShadow.setAttribute('cy',2);
  const HIP=[0,-128];
  const ang=lean*Math.PI/180,ca=Math.cos(ang),sa=Math.sin(ang);
  const up=(x,y)=>{const dx=x-HIP[0],dy=y-HIP[1];return[HIP[0]+dx*ca-dy*sa,HIP[1]+dx*sa+dy*ca+bodyY];};
  upper.setAttribute('transform',`translate(0,${bodyY}) rotate(${lean},${HIP[0]},${HIP[1]})`);
  // head
  let face='A';
  if(st.mode==='pause'){face=(Math.floor(st.pauseT/1.1)%2===0)?'C':'B';}
  for(const k in heads)heads[k].style.display=k===face?'':'none';
  headWrap.setAttribute('transform',st.mode==='pause'?`scale(${dir},1)`:'');
  const tilt=st.mode==='pause'?Math.sin(st.time*2.2)*2.5:swing*-3+Math.sin(st.time*3)*.6;
  headBob.setAttribute('transform',`translate(0,-208) rotate(${tilt},0,-2) translate(0,208)`);
  // leg
  const hipX=0,hipY=-126+bodyY;
  const ankX=footRel+2,ankY=-11-footLift;
  tapered(legPoly,hipX,hipY,ankX,ankY,13,8);
  sock.setAttribute('x',ankX-8);sock.setAttribute('y',ankY-4);
  const fx=ankX+3,fy=-footLift;
  slip.setAttribute('d',`M${fx-17},${fy-1} Q${fx-16},${fy-10} ${fx-2},${fy-9} Q${fx+12},${fy-9} ${fx+19},${fy-3} Q${fx+20},${fy+1} ${fx+14},${fy+1} L${fx-15},${fy+1}Z`);
  // stump leg
  const sx=-24+swing*16-lean*.5,sy=-74+bodyY*.5;
  tapered(stumpPoly,hipX,hipY,sx,sy,13,10.5);
  stumpEnd.setAttribute('cx',sx);stumpEnd.setAttribute('cy',sy);
  stumpPin.setAttribute('cx',sx+2);stumpPin.setAttribute('cy',sy+2);
  // crutches
  const padN=up(4,-197),padF=up(-6,-198);
  const shN=up(3,-207),shF=up(-5,-207);
  const tipN=[rel,-tipLift-2],tipF=[rel-9,-tipLift*.8-2];
  const hN=drawCrutch(cNear,padN,tipN),hF=drawCrutch(cFar,padF,tipF);
  drawArm(aNear,shN,hN);drawArm(aFar,shF,hF);
  // dust
  for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.t+=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;
    d.c.setAttribute('cx',d.x);d.c.setAttribute('cy',d.y);d.c.setAttribute('r',3+d.t*10);d.c.setAttribute('opacity',Math.max(0,.7-d.t*1.4));
    if(d.t>.5){d.c.remove();dust.splice(i,1);}}
}

/* ---------- loop ---------- */
let last=performance.now(),paused=false,tAll=0;
document.addEventListener('click',()=>{paused=!paused;const h=$('hint');h.textContent=paused?'Paused — click to resume':'Click or tap to pause / resume';h.style.opacity=1;});
setTimeout(()=>{$('hint').style.opacity=0;},5000);
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){
    tAll+=dt;
    clouds.forEach(c=>{c.x+=c.sp*dt;if(c.x>1400)c.x=-150;c.g.setAttribute('transform',`translate(${c.x},${c.y})`);});
    birds.forEach(b=>{b.x+=b.sp*dt;if(b.x>1320)b.x=-30;b.ph+=dt*7;b.g.setAttribute('transform',`translate(${b.x},${b.y+Math.sin(b.x/40)*8}) scale(1,${.6+Math.abs(Math.sin(b.ph))*.6})`);});
    smoke.forEach(s=>{s.t+=dt*.18;if(s.t>1)s.t-=1;s.c.setAttribute('cx',728+s.t*40+Math.sin(s.t*8)*4);s.c.setAttribute('cy',405-s.t*70);s.c.setAttribute('r',4+s.t*16);s.c.setAttribute('opacity',(1-s.t)*.5);});
    people.forEach(p=>{
      p.x+=p.dir*p.speed*dt;if(p.x>1380)p.x=-90;if(p.x<-90)p.x=1380;
      p.ph+=dt*p.speed/(p.H*.05)*.55;
      p.v.update(p.ph,tAll);
      p.v.g.setAttribute('transform',`translate(${p.x},${p.y}) scale(${p.dir*p.s},${p.s})`);
    });
    hens.forEach(h=>{
      h.t+=dt;
      const peck=(h.t%3.4)>2.6;
      if(!peck){h.x+=h.dir*h.sp*dt;if(h.x>1250){h.dir=-1;}if(h.x<30){h.dir=1;}if(Math.random()<.004)h.dir*=-1;}
      h.g.setAttribute('transform',`translate(${h.x},${h.y}) scale(${h.dir*h.s},${h.s})`);
      h.hd.setAttribute('transform',peck?`rotate(${35+Math.sin(h.t*18)*10},6,-18)`:'');
    });
    updateMain(dt);
  }
  requestAnimationFrame(frame);
}
