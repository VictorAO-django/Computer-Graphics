<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moving Car Animation</title>

<style>
body {
  text-align: center;
  font-family: Arial, sans-serif;
  background: #eaf5ff;
  padding: 25px;
}

h2 {
  color: #17365d;
}

.title {
  color: #5C6AC4;
}

.scene {
  width: 100%;
  max-width: 800px;
  height: 450px;
  margin: 20px auto;
  background: skyblue;
  position: relative;
  overflow: hidden;
  border: 2px solid #333;
  border-radius: 8px;
}

/* Sun */
.sun {
  width: 70px;
  height: 70px;
  background: gold;
  border-radius: 50%;
  position: absolute;
  top: 30px;
  right: 60px;
}

/* Clouds */
.cloud {
  width: 80px;
  height: 25px;
  background: white;
  border-radius: 30px;
  position: absolute;
  top: 80px;
}

.cloud::before,
.cloud::after {
  content: "";
  background: white;
  border-radius: 50%;
  position: absolute;
}

.cloud::before {
  width: 35px;
  height: 35px;
  top: -18px;
  left: 15px;
}

.cloud::after {
  width: 40px;
  height: 40px;
  top: -15px;
  left: 40px;
}

.cloud1 { left: 100px; }
.cloud2 { left: 400px; top: 120px; }

/* Grass */
.grass {
  position: absolute;
  top: 260px;
  width: 100%;
  height: 60px;
  background: #65ad50;
}

/* Road */
.road {
  position: absolute;
  top: 320px;
  width: 100%;
  height: 130px;
  background: #454545;
}

.line {
  position: absolute;
  top: 60px;
  width: 100%;
  height: 5px;
  background: repeating-linear-gradient(
    to right,
    yellow 0 65px,
    transparent 65px 120px
  );
}

/* Car */
.car {
  position: absolute;
  top: 250px;
  left: -160px;
  width: 150px;
  height: 100px;
  animation: moveCar 6s linear infinite;
}

/* Car roof */
.top {
  position: absolute;
  top: 0;
  left: 25px;
  width: 105px;
  height: 35px;
  background: #d32f2f;
  clip-path: polygon(20% 0, 75% 0, 100% 100%, 0 100%);
}

/* Windows */
.window {
  position: absolute;
  top: 7px;
  left: 8px;
  width: 35px;
  height: 23px;
  background: #bdebff;
}

.window:nth-child(2) {
  left: 52px;
  width: 40px;
}

/* Car body */
.body {
  position: absolute;
  top: 35px;
  width: 150px;
  height: 45px;
  background: black;
  border-radius: 5px;
}

.light {
  position: absolute;
  right: 0;
  top: 13px;
  width: 10px;
  height: 12px;
  background: yellow;
}

/* Wheels */
.wheel {
  position: absolute;
  top: 65px;
  width: 35px;
  height: 35px;
  background: #202020;
  border: 4px solid #555;
  border-radius: 50%;
  box-sizing: border-box;
}

.wheel1 { left: 18px; }
.wheel2 { right: 18px; }

/* Car movement */
@keyframes moveCar {
  from {
    left: -160px;
  }
  to {
    left: 100%;
  }
}
</style>
</head>

<body>

<h2>Moving Car Animation</h2>
<p>Computer Graphics using HTML and CSS</p>

<div class="scene">

  <div class="sun"></div>

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <div class="grass"></div>

  <div class="road">
    <div class="line"></div>
  </div>

  <div class="car">

    <div class="top">
      <div class="window"></div>
      <div class="window"></div>
    </div>

    <div class="body">
      <div class="light"></div>
    </div>

    <div class="wheel wheel1"></div>
    <div class="wheel wheel2"></div>

  </div>

</div>

</body>
</html>
