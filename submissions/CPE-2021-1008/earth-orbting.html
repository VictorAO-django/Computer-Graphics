<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Moving Moon</title>

<style>
body {
  padding: 25px;
}

.title {
  color: #5C6AC4;
}
</style>
</head>
<body>

<h2>Moving Moon Animation</h2>

<canvas id="moon" width="400" height="250"></canvas>

<script>
const c = document.getElementById("moon");
const ctx = c.getContext("2d");

let x = 0;

function animate() {

  // Night sky
  ctx.fillStyle = "navy";
  ctx.fillRect(0, 0, 400, 250);

  // Stars
  ctx.fillStyle = "white";

  for (let i = 0; i < 30; i++) {
    ctx.fillRect((i * 47) % 400, (i * 29) % 200, 2, 2);
  }

  // Moon
  ctx.beginPath();
  ctx.arc(x, 70, 30, 0, Math.PI * 2);
  ctx.fillStyle = "lightyellow";
  ctx.fill();

  // Ground
  ctx.fillStyle = "green";
  ctx.fillRect(0, 220, 400, 30);

  // Moon movement
  x += 1;

  if (x > 430) {
    x = -30;
  }

  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
