<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cat, mouse, car and the summit</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px 16px;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #f6f5f1;
        color: #2c2c2a;
      }

      main {
        max-width: 460px;
        margin: 0 auto;
      }

      h1 {
        font-size: 22px;
        font-weight: 500;
        margin: 0 0 16px;
      }

      h2 {
        font-size: 16px;
        font-weight: 500;
        margin: 0 0 12px;
      }

      .card {
        background: #ffffff;
        border: 0.5px solid #d3d1c7;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 20px;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .control {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        font-size: 14px;
        color: #5f5e5a;
      }

      .control input {
        flex: 1;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1f1e1d;
          color: #f1efe8;
        }

        .card {
          background: #2a2927;
          border-color: #444441;
        }

        .control {
          color: #b4b2a9;
        }
      }

      /* ===== The summit (drama scene) ===== */
      #scene.shake {
        animation: shake 0.45s linear;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(-5px, 3px);
        }
        40% {
          transform: translate(5px, -3px);
        }
        60% {
          transform: translate(-3px, -2px);
        }
        80% {
          transform: translate(3px, 2px);
        }
      }

      #clouds {
        animation: drift 18s ease-in-out infinite alternate;
      }

      @keyframes drift {
        from {
          transform: translateX(-30px);
        }
        to {
          transform: translateX(30px);
        }
      }

      .fig {
        transform-box: view-box;
        transition: transform 0.6s ease;
      }

      #rival {
        transform-origin: 80px 334px;
      }

      #rival.lean {
        transform: translateX(10px) rotate(4deg);
      }

      #rival.back {
        transform: translateX(-14px) rotate(-3deg);
      }

      #claude {
        transform-origin: 290px 334px;
      }

      #claude.power {
        transform: translateY(-4px) scale(1.05);
      }

      .breath {
        transform-box: view-box;
        animation: breathe 3s ease-in-out infinite;
      }

      .rival-breath {
        transform-origin: 80px 334px;
      }

      .claude-breath {
        transform-origin: 290px 334px;
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(1.02);
        }
      }

      #rival-head {
        transform-box: view-box;
        transform-origin: 80px 266px;
      }

      #rival-head.angry {
        animation: head-shake 0.5s ease-in-out infinite;
      }

      @keyframes head-shake {
        0%,
        100% {
          transform: rotate(-6deg);
        }
        50% {
          transform: rotate(6deg);
        }
      }

      #rays {
        opacity: 0;
        transform-box: view-box;
        transform-origin: 290px 244px;
      }

      #rays.on {
        animation: pulse 0.9s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1.25);
        }
      }

      #crutch {
        transform-box: view-box;
        transform-origin: 248px 288px;
      }

      #crutch.tap {
        animation: tap 1.2s ease-in-out infinite;
      }

      @keyframes tap {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-5deg);
        }
      }

      .bubble {
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .bubble.show {
        opacity: 1;
      }

      .bubble text {
        font:
          500 14px system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
    </style>
  </head>

  <body>
    <main>

    <script>
      /* ===== Cat, mouse and car ===== */
      const CENTER = { x: 190, y: 190 };
      const ORBIT_RADIUS = 110;
      const EYE_TRAVEL = 2.4;

      const mouse = document.getElementById("mouse");
      const pupilLeft = document.getElementById("pupil-left");
      const pupilRight = document.getElementById("pupil-right");
      const car = document.getElementById("car");
      const mouseSpeedInput = document.getElementById("mouse-speed");
      const carSpeedInput = document.getElementById("car-speed");

      const eyes = [
        { el: pupilLeft, x: 182, y: 162 },
        { el: pupilRight, x: 198, y: 162 },
      ];

      let mouseAngle = 0;
      let carAngle = 0;
      let lastTime = null;

      function lookAt(targetX, targetY) {
        eyes.forEach((eye) => {
          const dx = targetX - eye.x;
          const dy = targetY - eye.y;
          const dist = Math.hypot(dx, dy) || 1;
          eye.el.setAttribute(
            "cx",
            (eye.x + (dx / dist) * EYE_TRAVEL).toFixed(2),
          );
          eye.el.setAttribute(
            "cy",
            (eye.y + (dy / dist) * EYE_TRAVEL).toFixed(2),
          );
        });
      }

      function frame(time) {
        if (lastTime === null) lastTime = time;
        const dt = (time - lastTime) / 1000;
        lastTime = time;

        const mouseSpeed = parseFloat(mouseSpeedInput.value);
        const carSpeed = parseFloat(carSpeedInput.value);

        mouseAngle = (mouseAngle + mouseSpeed * 45 * dt) % 360;
        carAngle = (carAngle + carSpeed * 60 * dt) % 360;

        mouse.setAttribute(
          "transform",
          `rotate(${mouseAngle} ${CENTER.x} ${CENTER.y})`,
        );
        car.setAttribute(
          "transform",
          `rotate(${carAngle} ${CENTER.x} ${CENTER.y})`,
        );

        const rad = (mouseAngle * Math.PI) / 180;
        const mouseX = CENTER.x + ORBIT_RADIUS * Math.sin(rad);
        const mouseY = CENTER.y - ORBIT_RADIUS * Math.cos(rad);
        lookAt(mouseX, mouseY);

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);

      /* ===== The summit ===== */
      const $ = (id) => document.getElementById(id);
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      const scene = $("scene");
      const flashRect = $("flash");
      const bolt = $("bolt");
      const rival = $("rival");
      const rivalHead = $("rival-head");
      const claude = $("claude");
      const rays = $("rays");
      const crutch = $("crutch");
      const bubble1 = $("bubble1");
      const bubble2 = $("bubble2");
      const lines = {
        b1l1: $("b1l1"),
        b1l2: $("b1l2"),
        b2l1: $("b2l1"),
        b2l2: $("b2l2"),
      };

      const NS = "http://www.w3.org/2000/svg";
      const rainLayer = $("rain");
      const drops = [];

      for (let i = 0; i < 70; i++) {
        const line = document.createElementNS(NS, "line");
        line.setAttribute("stroke", "#8FA3C8");
        line.setAttribute("stroke-width", "1");
        line.setAttribute("opacity", "0.45");
        rainLayer.appendChild(line);
        drops.push({
          el: line,
          x: Math.random() * 400,
          y: Math.random() * 332,
          speed: 6 + Math.random() * 6,
        });
      }

      function animateRain() {
        drops.forEach((drop) => {
          drop.y += drop.speed;
          drop.x -= 2;
          if (drop.y > 332) {
            drop.y = -10;
            drop.x = Math.random() * 400;
          }
          drop.el.setAttribute("x1", drop.x.toFixed(1));
          drop.el.setAttribute("y1", drop.y.toFixed(1));
          drop.el.setAttribute("x2", (drop.x - 3).toFixed(1));
          drop.el.setAttribute("y2", (drop.y + 12).toFixed(1));
        });
        requestAnimationFrame(animateRain);
      }

      animateRain();

      async function typeLine(el, text, delay = 45) {
        el.textContent = "";
        for (const ch of text) {
          el.textContent += ch;
          await sleep(delay);
        }
      }

      async function flash(strong = true) {
        bolt.setAttribute("opacity", "1");
        flashRect.setAttribute("opacity", strong ? "0.85" : "0.35");
        if (strong) {
          scene.classList.remove("shake");
          void scene.getBoundingClientRect();
          scene.classList.add("shake");
        }
        await sleep(90);
        flashRect.setAttribute("opacity", "0.15");
        await sleep(70);
        flashRect.setAttribute("opacity", strong ? "0.6" : "0.25");
        await sleep(90);
        flashRect.setAttribute("opacity", "0");
        await sleep(250);
        bolt.setAttribute("opacity", "0");
      }

      function reset() {
        [bubble1, bubble2].forEach((b) => b.classList.remove("show"));
        Object.values(lines).forEach((l) => (l.textContent = ""));
        rival.classList.remove("lean", "back");
        rivalHead.classList.remove("angry");
        claude.classList.remove("power");
        rays.classList.remove("on");
        crutch.classList.remove("tap");
      }

      async function play() {
        while (true) {
          reset();
          await sleep(900);

          rival.classList.add("lean");
          rivalHead.classList.add("angry");
          bubble1.classList.add("show");
          await typeLine(lines.b1l1, "You'll never reach the summit.");
          await typeLine(lines.b1l2, "Not like that.", 70);
          await sleep(700);

          await flash(true);
          rival.classList.remove("lean");
          rivalHead.classList.remove("angry");
          await sleep(500);

          bubble1.classList.remove("show");
          await sleep(350);
          bubble2.classList.add("show");
          claude.classList.add("power");
          rays.classList.add("on");
          crutch.classList.add("tap");
          await typeLine(lines.b2l1, "Watch me. I never needed");
          await typeLine(lines.b2l2, "two legs to rise.", 70);
          await sleep(900);

          await flash(true);
          rival.classList.add("back");
          await sleep(2800);

          bubble2.classList.remove("show");
          await sleep(1200);
        }
      }

      function ambientLightning() {
        setTimeout(
          async () => {
            await flash(false);
            ambientLightning();
          },
          4000 + Math.random() * 5000,
        );
      }

      ambientLightning();
      play();
    </script>
  </body>
</html>
