<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Conversation at Dusk</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: #eef1f7;
    color: #20243a;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  main { width: min(100%, 960px); }
  h1 { margin: 0 0 14px; font-size: clamp(1.2rem, 3vw, 1.65rem); letter-spacing: -.03em; }
  .scene {
    overflow: hidden;
    border: 1px solid #d5d9e3;
    border-radius: 20px;
    background: #282940;
    box-shadow: 0 24px 60px rgba(37, 43, 68, .2);
  }
  svg { display: block; width: 100%; height: auto; }
  .skin { fill: #81543d; }
  .dialogue { transition: opacity .25s ease; }
  @media (prefers-reduced-motion: reduce) {
    .dialogue { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>A Conversation at Dusk</h1>
  <div class="scene">
    <svg id="scene" viewBox="0 0 960 540" role="img"
         aria-label="At dusk, a one-legged student balances with a crutch and talks with a supportive friend. Their conversation moves from loneliness to hope.">
      <defs>
        <linearGradient id="sky" x2="0" y2="1">
          <stop stop-color="#34345c"/>
          <stop offset=".62" stop-color="#a66c78"/>
          <stop offset="1" stop-color="#f0ad79"/>
        </linearGradient>
        <linearGradient id="ground" x2="0" y2="1">
          <stop stop-color="#716078"/>
          <stop offset="1" stop-color="#34384e"/>
        </linearGradient>
        <radialGradient id="lamplight">
          <stop stop-color="#ffd994" stop-opacity=".85"/>
          <stop offset="1" stop-color="#ffd994" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="faceClip"><ellipse rx="42" ry="50"/></clipPath>
      </defs>

      <rect width="960" height="540" fill="url(#sky)"/>
      <circle cx="465" cy="320" r="220" fill="url(#lamplight)" opacity=".55"/>
      <circle cx="780" cy="90" r="31" fill="#ffe2ad"/>
      <g fill="#282d47">
        <path d="M0 280 96 220 181 277V356H0Z"/>
        <path d="m728 282 94-90 138 89v78H728Z"/>
        <path d="M779 232h18v23h-18zm38 18h18v23h-18zm66 15h18v23h-18z" fill="#f3bd82" opacity=".7"/>
        <path d="M0 350h960v190H0z" fill="url(#ground)"/>
      </g>
      <path d="M0 390 Q240 365 480 390 T960 385" fill="none" stroke="#f4c38b" stroke-opacity=".3" stroke-width="3"/>
      <g fill="#ffd994" opacity=".75">
        <circle cx="120" cy="112" r="2"/><circle cx="215" cy="72" r="2"/>
        <circle cx="356" cy="105" r="1.7"/><circle cx="590" cy="84" r="2"/>
        <circle cx="692" cy="147" r="1.7"/><circle cx="875" cy="130" r="2"/>
      </g>

      <g id="storyteller" transform="translate(340 424)">
        <ellipse cx="22" cy="5" rx="82" ry="12" fill="#171c31" opacity=".5"/>
        <g id="crutch">
          <path d="M51-194 67-2" stroke="#523b32" stroke-width="8" stroke-linecap="round"/>
          <path d="M39-195h27" stroke="#3d302e" stroke-width="13" stroke-linecap="round"/>
          <path d="M53-108h25" stroke="#3d302e" stroke-width="9" stroke-linecap="round"/>
        </g>
        <path d="M-25-82h18l3 44-18 1z" fill="#34445f"/>
        <path d="M-24-39h17l-2 34h-24z" fill="#81543d"/>
        <path d="M-34-4h30q3 0 2 7h-39q0-5 7-7z" fill="#24283a"/>
        <path d="M9-82h22l-2 29-19 0z" fill="#34445f"/>
        <path d="M8-52q11 6 22 0" fill="none" stroke="#d7a984" stroke-width="3"/>
        <path d="M-46-181q46-20 92 0l8 103q-51 18-108 0z" fill="#e1e4ed" stroke="#a9adc0" stroke-width="2"/>
        <path d="m-16-181 16 24 16-24" fill="#fff9ee"/>
        <path d="M0-157v51" stroke="#aeb3c1" stroke-width="3" stroke-dasharray="3 8"/>
        <g id="armStory" transform="translate(-39-166)">
          <path d="M0 0q-20 8-30 35l12 12 27-35z" fill="#d9dde7" stroke="#a9adc0" stroke-width="2"/>
          <path d="M-29 36q-18 15-12 37l13 0 14-28z" class="skin"/>
          <path d="M-43 71q-8-4-7-13m10 11q-5-8-2-15m7 13q0-8 5-12" fill="none" stroke="#81543d" stroke-width="3" stroke-linecap="round"/>
        </g>
        <path d="M29-178q16 4 22 25l-12 8-13-19z" fill="#d9dde7" stroke="#a9adc0" stroke-width="2"/>
        <path d="M38-154 54-119" stroke="#81543d" stroke-width="12" stroke-linecap="round"/>
        <circle cx="56" cy="-111" r="9" class="skin"/>
        <path d="M-10-205h20v24h-20z" class="skin"/>
        <g id="headStory" transform="translate(0-234)">
          <image href="photo.jpeg" x="-42" y="-50" width="84" height="100"
                 preserveAspectRatio="xMidYMid slice" clip-path="url(#faceClip)"/>
          <ellipse rx="42" ry="50" fill="none" stroke="#f4d4b8" stroke-opacity=".7" stroke-width="2"/>
          <path id="mouthStory" d="M-8 25q8 6 16 0" fill="none" stroke="#542f31" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <g id="friend" transform="translate(640 424)">
        <ellipse cy="5" rx="67" ry="11" fill="#171c31" opacity=".5"/>
        <path d="M-28-82h18l-3 46h-15zM9-82h18l5 46H13z" fill="#3c3540"/>
        <path d="M-28-36h16l-2 33h-19zM14-36h17l8 33H19z" fill="#81543d"/>
        <path d="M-34-3h24q3 0 2 7h-33q0-5 7-7zM20-3h23q5 2 6 7H22z" fill="#252639"/>
        <path d="M-42-180q42-21 84 0l7 101q-47 17-98 0z" fill="#588d91" stroke="#376c75" stroke-width="2"/>
        <path d="M-17-179 0-154l17-25" fill="#f4e9d8"/>
        <g id="armFriend" transform="translate(-37-165)">
          <path d="M0 0q-17 10-19 36l14 7 19-33z" fill="#588d91" stroke="#376c75" stroke-width="2"/>
          <path d="M-18 37q-8 18 2 34l13-3 5-28z" class="skin"/>
          <circle cx="-9" cy="71" r="8" class="skin"/>
        </g>
        <path d="M35-178q17 7 22 27l-13 9-17-22z" fill="#588d91" stroke="#376c75" stroke-width="2"/>
        <path d="M46-148 55-117" stroke="#81543d" stroke-width="12" stroke-linecap="round"/>
        <circle cx="57" cy="-109" r="9" class="skin"/>
        <path d="M-10-205h20v24h-20z" class="skin"/>
        <g id="headFriend" transform="translate(0-234)">
          <ellipse cx="-38" cy="4" rx="7" ry="10" class="skin"/>
          <ellipse cx="38" cy="4" rx="7" ry="10" class="skin"/>
          <ellipse rx="39" ry="47" class="skin"/>
          <path d="M-39-8q2-42 40-43 37 4 38 48L27-18Q0-34-28-14z" fill="#302329"/>
          <path d="M-24-3h8m32 0h8" stroke="#2b2226" stroke-width="4" stroke-linecap="round"/>
          <path id="mouthFriend" d="M-8 23q8 6 16 0" fill="none" stroke="#542f31" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <g id="bubbleStory" class="dialogue">
        <path d="m303 123 16 20 17-20z" fill="#fff8ef" stroke="#705a71" stroke-width="2"/>
        <rect x="38" y="34" width="420" height="94" rx="18" fill="#fff8ef" stroke="#705a71" stroke-width="2"/>
        <text x="60" y="61" fill="#8a5d69" font-size="12" font-weight="700" letter-spacing="1.4">ME</text>
        <text id="lineStory" x="60" y="92" fill="#29283d" font-size="18" font-weight="600">I thought I had to face everything alone.</text>
      </g>
      <g id="bubbleFriend" class="dialogue" opacity="0">
        <path d="m632 123 16 20 17-20z" fill="#f0f7f5" stroke="#52787b" stroke-width="2"/>
        <rect x="496" y="34" width="426" height="94" rx="18" fill="#f0f7f5" stroke="#52787b" stroke-width="2"/>
        <text x="518" y="61" fill="#477174" font-size="12" font-weight="700" letter-spacing="1.4">FRIEND</text>
        <text id="lineFriend" x="518" y="92" fill="#29283d" font-size="18" font-weight="600">You don't. I'm right here.</text>
      </g>
    </svg>
  </div>
</main>
<script>
(() => {
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reducedMotion) return;

  const $ = (id) => document.getElementById(id);
  const bubbleStory = $("bubbleStory");
  const bubbleFriend = $("bubbleFriend");
  const mouthStory = $("mouthStory");
  const mouthFriend = $("mouthFriend");
  const armStory = $("armStory");
  const armFriend = $("armFriend");
  const headStory = $("headStory");
  const headFriend = $("headFriend");
  const lineStory = $("lineStory");
  const lineFriend = $("lineFriend");
  const start = performance.now();

  function animate(now) {
    const time = ((now - start) / 1000) % 18;
    const storySpeaking = time < 4.5 || (time >= 9 && time < 13.5);
    const storyLine = time < 9
      ? "I thought I had to face everything alone."
      : "This is not the end of my story.";
    const friendLine = time < 9
      ? "You don't. I'm right here."
      : "And I'll be here for the next chapter.";

    bubbleStory.setAttribute("opacity", storySpeaking ? "1" : "0");
    bubbleFriend.setAttribute("opacity", storySpeaking ? "0" : "1");
    lineStory.textContent = storyLine;
    lineFriend.textContent = friendLine;

    const speaking = storySpeaking ? mouthStory : mouthFriend;
    const quiet = storySpeaking ? mouthFriend : mouthStory;
    const opening = 2 + Math.abs(Math.sin(now / 70)) * 8;
    speaking.setAttribute("d", `M-8 25 Q0 ${25 + opening} 8 25 Q0 ${28 - opening / 3} -8 25 Z`);
    quiet.setAttribute("d", "M-8 25 Q0 31 8 25");

    armStory.setAttribute("transform", `translate(-39 -166) rotate(${Math.sin(now / 650) * 28 - 8})`);
    armFriend.setAttribute("transform", `translate(-37 -165) rotate(${storySpeaking ? -3 : Math.sin(now / 800) * 10 + 5})`);
    headStory.setAttribute("transform", `translate(0 ${-234 + Math.sin(now / 500) * 2})`);
    headFriend.setAttribute("transform", `translate(0 ${-234 + (storySpeaking ? 0 : Math.sin(now / 500) * 2)})`);
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
