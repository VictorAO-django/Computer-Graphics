
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real 3D Rotating Car</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #111827;
    font-family: Arial, sans-serif;
}

#scene {
    width: 100vw;
    height: 100vh;
}

.info {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: white;
    pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div class="info">
    <h2>REAL 3D CAR ROTATION</h2>
    <p>360° Continuous Rotation</p>
</div>

<div id="scene"></div>

<script type="module">

import * as THREE from 'three';

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111827);

// CAMERA
const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(7, 4.5, 7);
camera.lookAt(0, 0.8, 0);

// RENDERER
const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.getElementById("scene").appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.AmbientLight(0xffffff, 1.5));

const sunlight = new THREE.DirectionalLight(0xffffff, 3);
sunlight.position.set(5, 8, 6);
sunlight.castShadow = true;
scene.add(sunlight);

const fillLight = new THREE.PointLight(0x8abfff, 35);
fillLight.position.set(-5, 4, -4);
scene.add(fillLight);

// MATERIALS
const red = new THREE.MeshStandardMaterial({
    color: 0xd71920,
    metalness: 0.65,
    roughness: 0.3
});

const dark = new THREE.MeshStandardMaterial({
    color: 0x17191e,
    metalness: 0.3,
    roughness: 0.5
});

const glass = new THREE.MeshStandardMaterial({
    color: 0x163d55,
    metalness: 0.5,
    roughness: 0.15,
    transparent: true,
    opacity: 0.85
});

const silver = new THREE.MeshStandardMaterial({
    color: 0xbfc5cc,
    metalness: 0.85,
    roughness: 0.2
});

const headlightMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xffffcc,
    emissiveIntensity: 2
});

const tailLightMaterial = new THREE.MeshStandardMaterial({
    color: 0xff1111,
    emissive: 0xff0000,
    emissiveIntensity: 1.5
});

// CAR GROUP
const car = new THREE.Group();
scene.add(car);

// FUNCTION TO CREATE BOXES
function box(parent, w, h, d, material, x, y, z) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        material
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);

    return mesh;
}

// MAIN CAR BODY
box(car, 2.1, 0.65, 4.3, red, 0, 0.75, 0);

// LOWER CHASSIS
box(car, 2.05, 0.22, 4.15, dark, 0, 0.42, 0);

// BONNET
box(car, 2.0, 0.18, 1.1, red, 0, 1.12, 1.45);

// BOOT
box(car, 1.95, 0.18, 0.75, red, 0, 1.12, -1.65);

// CABIN - ACTUAL 3D SHAPE
const cabinShape = new THREE.Shape();

cabinShape.moveTo(-0.88, 0);
cabinShape.lineTo(0.88, 0);
cabinShape.lineTo(0.67, 0.9);
cabinShape.lineTo(-0.67, 0.9);
cabinShape.closePath();

const cabinGeometry = new THREE.ExtrudeGeometry(
    cabinShape,
    {
        depth: 2.0,
        bevelEnabled: true,
        bevelSegments: 3,
        bevelSize: 0.04,
        bevelThickness: 0.04
    }
);

cabinGeometry.translate(0, 0, -1);

const cabin = new THREE.Mesh(cabinGeometry, red);
cabin.position.y = 1.05;
cabin.castShadow = true;
car.add(cabin);

// ROOF
box(car, 1.35, 0.12, 1.8, red, 0, 1.91, 0);

// SIDE WINDOWS
for (const side of [-1, 1]) {

    box(
        car,
        0.035,
        0.55,
        1.55,
        glass,
        side * 0.875,
        1.58,
        0
    );

    // DOOR PANELS
    box(
        car,
        0.035,
        0.35,
        1.2,
        red,
        side * 1.055,
        0.78,
        -0.05
    );

    // MIRRORS
    const mirror = new THREE.Mesh(
        new THREE.BoxGeometry(0.22, 0.14, 0.3),
        dark
    );

    mirror.position.set(side * 1.15, 1.35, 0.85);
    car.add(mirror);
}

// WINDSHIELD
const windshield = new THREE.Mesh(
    new THREE.BoxGeometry(1.35, 0.66, 0.045),
    glass
);

windshield.position.set(0, 1.55, 1.01);
windshield.rotation.x = -0.25;
car.add(windshield);

// REAR WINDOW
const rearWindow = new THREE.Mesh(
    new THREE.BoxGeometry(1.3, 0.62, 0.045),
    glass
);

rearWindow.position.set(0, 1.55, -1.01);
rearWindow.rotation.x = 0.25;
car.add(rearWindow);

// WHEELS
function createWheel(x, z) {

    const wheel = new THREE.Group();

    const tire = new THREE.Mesh(
        new THREE.CylinderGeometry(0.43, 0.43, 0.28, 40),
        dark
    );

    tire.rotation.z = Math.PI / 2;
    wheel.add(tire);

    const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.25, 0.30, 32),
        silver
    );

    rim.rotation.z = Math.PI / 2;
    wheel.add(rim);

    wheel.position.set(x, 0.48, z);

    wheel.traverse(obj => {
        if (obj.isMesh) obj.castShadow = true;
    });

    car.add(wheel);
}

// FOUR WHEELS
createWheel(-1.05, 1.3);
createWheel(1.05, 1.3);
createWheel(-1.05, -1.3);
createWheel(1.05, -1.3);

// HEADLIGHTS - FRONT
for (const side of [-1, 1]) {

    const light = new THREE.Mesh(
        new THREE.BoxGeometry(0.48, 0.15, 0.06),
        headlightMaterial
    );

    light.position.set(side * 0.7, 0.88, 2.17);
    car.add(light);

    // REAR LIGHTS
    const rear = new THREE.Mesh(
        new THREE.BoxGeometry(0.45, 0.16, 0.06),
        tailLightMaterial
    );

    rear.position.set(side * 0.7, 0.9, -2.17);
    car.add(rear);
}

// FRONT GRILLE
box(car, 0.8, 0.25, 0.06, dark, 0, 0.62, 2.18);

// FRONT BUMPER
box(car, 2.0, 0.12, 0.12, silver, 0, 0.39, 2.18);

// REAR BUMPER
box(car, 2.0, 0.12, 0.12, silver, 0, 0.39, -2.18);

// FLOOR
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({
        color: 0x252d3b,
        roughness: 0.8
    })
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.03;
floor.receiveShadow = true;
scene.add(floor);

// CENTER CAR
car.position.y = 0;

// ROTATION SPEED
let speed = 0.008;

// ANIMATION
function animate() {

    requestAnimationFrame(animate);

    // Rotate around its own vertical axis
    car.rotation.y += speed;

    renderer.render(scene, camera);
}

animate();

// RESPONSIVE SCREEN
window.addEventListener("resize", () => {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
