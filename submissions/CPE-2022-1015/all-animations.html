<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML and CSS Animations</title>
  <style>
/* ------------------------------------------------------------------
   SPEED SETTINGS
   Change these values to speed up or slow down each animation.
   A shorter time means faster. A longer time means slower.
------------------------------------------------------------------- */
:root {
  --ball-speed: 1.4s;   /* one full bounce */
  --car-speed: 0.6s;    /* one wheel turn and one road dash shift */
  --moon-speed: 10s;    /* one full orbit around the Earth */
  --earth-speed: 5s;    /* one full turn of the Earth's land patches */
}

/* ------------------------------------------------------------------
   PAGE LAYOUT
------------------------------------------------------------------- */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f4f8;
  color: #1f2937;
}

header {
  max-width: 700px;
  margin: 0 auto;
  padding: 20px 16px 4px;
}

header h1 {
  font-size: 20px;
  margin: 0 0 6px;
}

header p {
  font-size: 16px;
  margin: 2px 0;
}

main {
  max-width: 700px;
  margin: 0 auto;
  padding: 8px 16px 32px;
}

section {
  margin-top: 24px;
}

section h2 {
  font-size: 16px;
  margin: 0 0 8px;
}

.scene {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
}

/* ------------------------------------------------------------------
   1. BOUNCING BALL
   The ball falls (speeds up), squashes on the ground, then rises
   (slows down). The shadow grows as the ball gets closer to the ground.
------------------------------------------------------------------- */
@keyframes drop {
  0% {
    transform: translateY(0) scale(0.92, 1.08);
    animation-timing-function: cubic-bezier(0.45, 0, 0.9, 0.55);
  }
  48% {
    transform: translateY(96px) scale(1, 1);
  }
  50% {
    transform: translateY(96px) scale(1.18, 0.8);
    animation-timing-function: cubic-bezier(0.1, 0.45, 0.55, 1);
  }
  52% {
    transform: translateY(96px) scale(1, 1);
    animation-timing-function: cubic-bezier(0.1, 0.45, 0.55, 1);
  }
  100% {
    transform: translateY(0) scale(0.92, 1.08);
  }
}

@keyframes shadow-grow {
  0%, 100% {
    transform: scale(0.45);
    opacity: 0.25;
  }
  50% {
    transform: scale(1.1);
    opacity: 0.55;
  }
}

.ball {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: drop var(--ball-speed) infinite;
}

.ball-shadow {
  transform-box: fill-box;
  transform-origin: center;
  animation: shadow-grow var(--ball-speed) infinite;
}

/* ------------------------------------------------------------------
   2. RACING CAR
   The car stays in the middle. The road dashes and speed lines slide
   left, the wheels spin clockwise, and the car bobs slightly.
------------------------------------------------------------------- */
@keyframes road-move {
  to {
    stroke-dashoffset: 48;
  }
}

@keyframes wheel-spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes rush {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-480px);
  }
}

@keyframes bob {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-1.5px);
  }
}

.road-dash {
  stroke-dasharray: 24 24;
  animation: road-move var(--car-speed) linear infinite;
}

.wheel {
  transform-box: fill-box;
  transform-origin: center;
  animation: wheel-spin var(--car-speed) linear infinite;
}

.car {
  animation: bob calc(var(--car-speed) * 0.3) ease-in-out infinite;
}

/* Each speed line has its own speed and starting delay. */
.speed-line {
  animation: rush 1s linear infinite;
}
.sl1 { animation-duration: 0.7s; animation-delay: -0.2s; }
.sl2 { animation-duration: 1.1s; animation-delay: -0.8s; }
.sl3 { animation-duration: 0.9s; animation-delay: -0.5s; }
.sl4 { animation-duration: 1.3s; animation-delay: -0.1s; }

/* ------------------------------------------------------------------
   3. ROTATING MOON
   The moon orbits the Earth anticlockwise. The craters turn with it,
   so the same face always points at the Earth. The Earth's land
   patches also turn anticlockwise.
------------------------------------------------------------------- */
@keyframes anticlockwise {
  to {
    transform: rotate(-360deg);
  }
}

@keyframes twinkle {
  0%, 100% {
    opacity: 0.3;
  }
  50% {
    opacity: 1;
  }
}

.orbit {
  transform-origin: 190px 120px;
  animation: anticlockwise var(--moon-speed) linear infinite;
}

.earth-land {
  transform-origin: 190px 120px;
  animation: anticlockwise var(--earth-speed) linear infinite;
}

.star {
  animation: twinkle 2.5s ease-in-out infinite;
}
.star.d1 { animation-delay: 0.6s; }
.star.d2 { animation-delay: 1.2s; }
.star.d3 { animation-delay: 1.8s; }

  </style>
</head>
<body>

  <header>
    <h1>Name: Ajala Fortunate Iyinoluwa</h1>
    <p>Matric No: CPE/2022/1015</p>
  </header>

  <main>

    <!-- 1. Bouncing ball -->
    <section>
      <h2>1. Bouncing ball</h2>
      <svg class="scene" viewBox="0 0 380 190" role="img" aria-labelledby="ball-title">
        <title id="ball-title">Bouncing ball</title>
        <rect width="380" height="190" fill="#E6F1FB"/>
        <rect y="152" width="380" height="38" fill="#97C459"/>
        <rect y="150" width="380" height="4" fill="#3B6D11"/>
        <ellipse class="ball-shadow" cx="190" cy="156" rx="30" ry="5" fill="#173404"/>
        <g class="ball">
          <circle cx="190" cy="42" r="20" fill="#E24B4A"/>
          <circle cx="183" cy="35" r="6" fill="#F7C1C1"/>
          <path d="M172 48 Q190 58 208 48" fill="none" stroke="#A32D2D" stroke-width="2"/>
        </g>
      </svg>
    </section>

    <!-- 2. Racing car -->
    <section>
      <h2>2. Racing car</h2>
      <svg class="scene" viewBox="0 0 380 160" role="img" aria-labelledby="car-title">
        <title id="car-title">Racing car</title>
        <rect width="380" height="160" fill="#B5D4F4"/>
        <rect y="112" width="380" height="48" fill="#444441"/>
        <line class="road-dash" x1="0" y1="138" x2="380" y2="138" stroke="#FAC775" stroke-width="3"/>

        <!-- Speed lines rushing past -->
        <rect class="speed-line sl1" x="400" y="20" width="44" height="3" rx="1.5" fill="#fff"/>
        <rect class="speed-line sl2" x="400" y="40" width="50" height="3" rx="1.5" fill="#fff"/>
        <rect class="speed-line sl3" x="400" y="58" width="36" height="3" rx="1.5" fill="#fff"/>
        <rect class="speed-line sl4" x="400" y="76" width="60" height="3" rx="1.5" fill="#fff"/>

        <g class="car">
          <!-- Body and cabin -->
          <path d="M112 98 L112 84 Q112 78 120 78 L150 78 L166 62 L204 62 L222 78 L246 80 Q252 82 252 90 L252 98 Z" fill="#E24B4A"/>
          <path d="M156 78 L169 66 L186 66 L186 78 Z" fill="#E6F1FB"/>
          <path d="M191 78 L191 66 L203 66 L215 78 Z" fill="#E6F1FB"/>
          <rect x="112" y="90" width="140" height="4" fill="#A32D2D"/>
          <!-- Rear spoiler -->
          <rect x="104" y="66" width="22" height="4" rx="1" fill="#2C2C2A"/>
          <rect x="110" y="70" width="3" height="10" fill="#2C2C2A"/>
          <!-- Rear wheel -->
          <circle cx="142" cy="100" r="14" fill="#2C2C2A"/>
          <g class="wheel">
            <circle cx="142" cy="100" r="7" fill="#B4B2A9"/>
            <line x1="142" y1="93" x2="142" y2="107" stroke="#444441" stroke-width="2"/>
            <line x1="135" y1="100" x2="149" y2="100" stroke="#444441" stroke-width="2"/>
          </g>
          <!-- Front wheel -->
          <circle cx="222" cy="100" r="14" fill="#2C2C2A"/>
          <g class="wheel">
            <circle cx="222" cy="100" r="7" fill="#B4B2A9"/>
            <line x1="222" y1="93" x2="222" y2="107" stroke="#444441" stroke-width="2"/>
            <line x1="215" y1="100" x2="229" y2="100" stroke="#444441" stroke-width="2"/>
          </g>
        </g>
      </svg>
    </section>

    <!-- 3. Rotating moon -->
    <section>
      <h2>3. Rotating moon</h2>
      <svg class="scene" viewBox="0 0 380 240" role="img" aria-labelledby="moon-title">
        <title id="moon-title">Rotating moon</title>
        <rect width="380" height="240" fill="#0C1B33"/>

        <!-- Twinkling stars -->
        <circle class="star" cx="40" cy="36" r="1.5" fill="#fff"/>
        <circle class="star d1" cx="330" cy="50" r="1.5" fill="#fff"/>
        <circle class="star d2" cx="70" cy="196" r="1.5" fill="#fff"/>
        <circle class="star d3" cx="320" cy="200" r="1.5" fill="#fff"/>
        <circle class="star" cx="350" cy="120" r="1" fill="#fff"/>
        <circle class="star d1" cx="24" cy="120" r="1" fill="#fff"/>

        <!-- Orbit path -->
        <circle cx="190" cy="120" r="82" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 5"/>

        <!-- Earth with turning land patches -->
        <circle cx="190" cy="120" r="26" fill="#378ADD"/>
        <g class="earth-land">
          <circle cx="184" cy="112" r="7" fill="#639922"/>
          <circle cx="198" cy="128" r="6" fill="#639922"/>
          <circle cx="200" cy="114" r="4" fill="#639922"/>
        </g>

        <!-- Moon, orbiting anticlockwise with its craters -->
        <g class="orbit">
          <circle cx="272" cy="120" r="15" fill="#D3D1C7"/>
          <circle cx="266" cy="115" r="4" fill="#B4B2A9"/>
          <circle cx="277" cy="124" r="3" fill="#B4B2A9"/>
          <circle cx="268" cy="127" r="2.5" fill="#B4B2A9"/>
          <circle cx="278" cy="113" r="2" fill="#B4B2A9"/>
        </g>
      </svg>
    </section>

  </main>

</body>
</html>
