<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Graphics Animations</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #222;
}

h1 {
    text-align: center;
    padding: 20px 10px;
}

.animation {
    width: min(900px, 94%);
    height: 240px;
    margin: 20px auto;
    border: 2px solid #333;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    background: white;
}

h2 {
    position: absolute;
    top: 5px;
    left: 15px;
    font-size: 18px;
    z-index: 5;
}

/* 1. BOUNCING BALL */
.ground {
    position: absolute;
    bottom: 25px;
    width: 100%;
    height: 4px;
    background: #555;
}

.ball {
    width: 45px;
    height: 45px;
    background: crimson;
    border-radius: 50%;
    position: absolute;
    left: 45%;
    bottom: 29px;
    animation: bounce 1s infinite ease-in-out;
}

@keyframes bounce {
    0%, 100% {
        bottom: 29px;
    }
    50% {
        bottom: 170px;
    }
}

/* 2. MOVING CAR */
.road {
    position: absolute;
    bottom: 25px;
    height: 65px;
    width: 100%;
    background: #555;
}

.road::after {
    content: "";
    position: absolute;
    top: 31px;
    width: 100%;
    border-top: 3px dashed white;
}

.car {
    position: absolute;
    bottom: 55px;
    left: -130px;
    width: 110px;
    height: 48px;
    animation: drive 5s linear infinite;
}

.car-body {
    position: absolute;
    bottom: 10px;
    width: 110px;
    height: 30px;
    background: #1684db;
    border-radius: 12px 18px 4px 4px;
}

.car-top {
    position: absolute;
    bottom: 35px;
    left: 23px;
    width: 60px;
    height: 22px;
    background: #1684db;
    clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
}

.window {
    position: absolute;
    bottom: 36px;
    left: 40px;
    width: 28px;
    height: 15px;
    background: lightblue;
    clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
}

.wheel {
    position: absolute;
    bottom: 0;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #111;
    border: 5px solid #bbb;
}

.wheel.one {
    left: 15px;
}

.wheel.two {
    right: 12px;
}

@keyframes drive {
    from {
        left: -130px;
    }
    to {
        left: calc(100% + 130px);
    }
}

/* 3. MOVING MOON */
.sky {
    background: #07152f;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
}

.star.s1 { top: 60px; left: 15%; }
.star.s2 { top: 95px; left: 30%; }
.star.s3 { top: 65px; left: 55%; }
.star.s4 { top: 110px; left: 75%; }
.star.s5 { top: 45px; left: 88%; }

.moon {
    position: absolute;
    top: 75px;
    left: 0;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #fff2b0;
    box-shadow: 0 0 25px #fff2b0;
    animation: moonmove 6s linear infinite alternate;
}

@keyframes moonmove {
    from {
        left: 5%;
    }
    to {
        left: 85%;
    }
}

.caption {
    text-align: center;
    margin: 8px auto 25px;
    color: #444;
}
</style>
</head>

<body>

<h1>Computer Graphics: CSS Animations</h1>

<section class="animation">
    <h2>1. Bouncing Ball</h2>
    <div class="ground"></div>
    <div class="ball"></div>
</section>
<p class="caption">ball repeatedly moves up and down.</p>

<section class="animation">
    <h2>2. Moving Car</h2>
    <div class="road"></div>

    <div class="car">
        <div class="car-top"></div>
        <div class="window"></div>
        <div class="car-body"></div>
        <div class="wheel one"></div>
        <div class="wheel two"></div>
    </div>
</section>
<p class="caption">The car moves across the screen and reappears.</p>

<section class="animation sky">
    <h2 style="color:white">3. Moving Moon</h2>
    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
    <div class="star s5"></div>
    <div class="moon"></div>
</section>
<p class="caption">The moon travels through the night sky.</p>

</body>
</html>
