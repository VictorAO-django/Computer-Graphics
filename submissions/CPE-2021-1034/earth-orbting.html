<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moon Orbit - Computer Graphics Assignment</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0712;
  }
  canvas {
    background: #140824;
    border: 2px solid #444;
    border-radius: 6px;
  }
</style>
</head>
<body>

<canvas id="scene" width="800" height="600"></canvas>

<script>
/* =====================================================================
 * MOON ORBIT - HTML/Canvas version of moving_moon.c
 * ---------------------------------------------------------------------
 * Technique: circular motion from the parametric equations of a circle,
 * exactly as in the C program.
 *     x = centerX + ORBIT_RADIUS * cos(angle)
 *     y = centerY + ORBIT_RADIUS * sin(angle)
 * `angle` grows a little every frame and wraps back after a full turn.
 * ===================================================================== */

/* ---------------------------------------------------------------------
 *  THE SINGLE CONTROL POINT -- the only values to edit.
 *      ORBIT_SPEED    how far the moon turns per frame, in radians.
 *                     Positive = anticlockwise, negative = clockwise.
 *      ORBIT_RADIUS   distance from the planet's centre to the moon, in pixels
 *      moonRadius / planetRadius   sizes, in pixels
 *      moonColor / planetColor / bgColor   any CSS colour string
 *                     (the craters are a darker shade of moonColor,
 *                     worked out automatically -- not a separate value)
 * --------------------------------------------------------------------- */
const CONFIG = {
  ORBIT_SPEED: 0.02,
  ORBIT_RADIUS: 220,
  moonRadius: 35,
  planetRadius: 60,
  moonColor:   "#ffeb73",   // soft moon-yellow
  planetColor: "#2666d9",   // ocean blue
  bgColor:     "#140824",   // deep purple night sky
};

const NUM_STARS = 150;

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

let angle = 0;

// fixed random star positions, generated once -- same idea as initStars() in the C file
const stars = [];
for (let i = 0; i < NUM_STARS; i++) {
  stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height });
}

function drawCircle(cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawRing(cx, cy, r) {
  ctx.strokeStyle = "#4d4873";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

function drawStars() {
  ctx.fillStyle = "#fff2b3";
  for (const s of stars) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPlanet(x, y) {
  drawCircle(x, y, CONFIG.planetRadius, CONFIG.planetColor);
  // a lighter "continent" patch, purely decorative, same spirit as the C version
  drawCircle(x - CONFIG.planetRadius * 0.25, y - CONFIG.planetRadius * 0.2, CONFIG.planetRadius * 0.35, "#4caf63");
}

// darkens a hex colour by a factor (0..1), used for the moon's craters so
// they always match CONFIG.moonColor -- same trick as the C file's
// `moonColor * 0.7` for crater shading.
function shade(hex, factor) {
  const r = parseInt(hex.slice(1, 3), 16) * factor;
  const g = parseInt(hex.slice(3, 5), 16) * factor;
  const b = parseInt(hex.slice(5, 7), 16) * factor;
  return `rgb(${r | 0}, ${g | 0}, ${b | 0})`;
}

function drawMoon(x, y) {
  drawCircle(x, y, CONFIG.moonRadius, CONFIG.moonColor);
  const craterColor = shade(CONFIG.moonColor, 0.7);
  drawCircle(x - CONFIG.moonRadius * 0.35, y + CONFIG.moonRadius * 0.25, CONFIG.moonRadius * 0.18, craterColor);
  drawCircle(x + CONFIG.moonRadius * 0.3, y - CONFIG.moonRadius * 0.3, CONFIG.moonRadius * 0.12, craterColor);
}

function update() {
  angle += CONFIG.ORBIT_SPEED;
  if (angle > Math.PI * 2) angle -= Math.PI * 2;
  else if (angle < 0) angle += Math.PI * 2;
}

function draw() {
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;

  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawStars();
  drawRing(centerX, centerY, CONFIG.ORBIT_RADIUS);
  drawPlanet(centerX, centerY);

  const x = centerX + CONFIG.ORBIT_RADIUS * Math.cos(angle);
  const y = centerY + CONFIG.ORBIT_RADIUS * Math.sin(angle);
  drawMoon(x, y);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
