<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bouncing Ball - Rigid 3D Sphere</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a1a; }
        canvas { border: 2px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 4px; }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        /* 
         * CONFIG: Controls all tunable parameters for the animation.
         * - ballColor: Base color of the ball (a 3D lighting gradient is applied over this).
         * - backgroundColor: CSS color string for the canvas background.
         * - radius: Size of the ball in pixels.
         * - startX / startY: Initial position. Use a number, or "center" to auto-center.
         * - velocityX / velocityY: Speed and direction per frame (sign determines direction).
         */
        const CONFIG = {
            ballColor: "#d32f2f", 
            backgroundColor: "#2b2b2b",
            radius: 45,
            startX: "center",
            startY: "center",
            velocityX: 6, // Positive = right, negative = left. 0 = straight vertical.
            velocityY: 5  // Positive = down, negative = up. 0 = straight horizontal.
        };

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        // Initialize state directly from CONFIG
        let x = CONFIG.startX === "center" ? canvas.width / 2 : CONFIG.startX;
        let y = CONFIG.startY === "center" ? canvas.height / 2 : CONFIG.startY;
        let vx = CONFIG.velocityX;
        let vy = CONFIG.velocityY;

        function update() {
            // Standard linear translation
            x += vx;
            y += vy;

            // X-axis screen edge collision
            if (x - CONFIG.radius <= 0) {
                x = CONFIG.radius; // Snap to boundary to prevent getting stuck
                vx = -vx;          // Reverse direction
            } else if (x + CONFIG.radius >= canvas.width) {
                x = canvas.width - CONFIG.radius;
                vx = -vx;
            }

            // Y-axis screen edge collision
            if (y - CONFIG.radius <= 0) {
                y = CONFIG.radius;
                vy = -vy;
            } else if (y + CONFIG.radius >= canvas.height) {
                y = canvas.height - CONFIG.radius;
                vy = -vy;
            }
        }

        function draw() {
            // Draw solid background
            ctx.fillStyle = CONFIG.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw the base colored circle
            ctx.beginPath();
            ctx.arc(x, y, CONFIG.radius, 0, Math.PI * 2);
            ctx.fillStyle = CONFIG.ballColor;
            ctx.fill();
            ctx.closePath();

            // Overlay a 3D lighting gradient to make it look like a physical sphere
            ctx.beginPath();
            ctx.arc(x, y, CONFIG.radius, 0, Math.PI * 2);
            
            // Shift the center of the gradient to the top-left for a simulated light source
            const lightOffsetX = x - (CONFIG.radius * 0.35);
            const lightOffsetY = y - (CONFIG.radius * 0.35);
            
            const lightingGrad = ctx.createRadialGradient(
                lightOffsetX, lightOffsetY, CONFIG.radius * 0.05, // Brightest inner point
                x, y, CONFIG.radius                               // Darkest outer edge
            );
            
            // Highlight
            lightingGrad.addColorStop(0, "rgba(255, 255, 255, 0.7)");
            lightingGrad.addColorStop(0.2, "rgba(255, 255, 255, 0.1)");
            lightingGrad.addColorStop(0.5, "rgba(0, 0, 0, 0)"); // Base color shows through
            // Shadow
            lightingGrad.addColorStop(0.85, "rgba(0, 0, 0, 0.3)");
            lightingGrad.addColorStop(1, "rgba(0, 0, 0, 0.7)");
            
            ctx.fillStyle = lightingGrad;
            ctx.fill();
            ctx.closePath();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
