<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouncing Ball</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; height: auto; border: 1px solid #2a3140; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ===================== EDIT ONLY THIS OBJECT =====================
   canvasWidth / canvasHeight : canvas size in pixels
   backgroundColor            : fill color behind everything
   ballColor                  : main ball color
   highlightColor             : small shine spot on the ball
   shadowColor                : floor-less drop shadow under the ball
   radius                     : ball radius in pixels
   startX / startY            : starting position in pixels, or "center"
   velocityX / velocityY      : pixels per frame. Sign = direction
                                (+X right, -X left, +Y down, -Y up).
                                One axis 0  -> bounces between two walls.
                                Both non-zero -> diagonal four-wall bounce.
   trailLength                : number of past positions drawn as a trail (0 = off)
   trailMaxAlpha              : opacity of the newest trail dot (0..1)
   highlightOffset            : shine spot offset as a fraction of radius
   highlightSize              : shine spot size as a fraction of radius
   shadowOffsetY              : shadow offset below ball, fraction of radius
   shadowAlpha                : shadow opacity (0..1)
================================================================== */
const CONFIG = {
  canvasWidth: 800,
  canvasHeight: 600,
  backgroundColor: "#10131a",
  ballColor: "#ff7a45",
  highlightColor: "#ffd9c7",
  shadowColor: "#000000",
  radius: 30,
  startX: "center",
  startY: "center",
  velocityX: 5,
  velocityY: 3,
  trailLength: 18,
  trailMaxAlpha: 0.35,
  highlightOffset: 0.35,
  highlightSize: 0.22,
  shadowOffsetY: 0.25,
  shadowAlpha: 0.3
};

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = CONFIG.canvasWidth;
canvas.height = CONFIG.canvasHeight;

const ball = {
  x: CONFIG.startX === "center" ? canvas.width / 2 : CONFIG.startX,
  y: CONFIG.startY === "center" ? canvas.height / 2 : CONFIG.startY,
  vx: CONFIG.velocityX,
  vy: CONFIG.velocityY
};
const trail = [];

function update() {
  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > CONFIG.trailLength) trail.shift();

  ball.x += ball.vx;
  ball.y += ball.vy;

  // Edge collision: clamp inside the canvas, then reflect that axis' velocity.
  if (ball.x - CONFIG.radius < 0)             { ball.x = CONFIG.radius;                       ball.vx = -ball.vx; }
  if (ball.x + CONFIG.radius > canvas.width)  { ball.x = canvas.width - CONFIG.radius;        ball.vx = -ball.vx; }
  if (ball.y - CONFIG.radius < 0)             { ball.y = CONFIG.radius;                       ball.vy = -ball.vy; }
  if (ball.y + CONFIG.radius > canvas.height) { ball.y = canvas.height - CONFIG.radius;       ball.vy = -ball.vy; }
}

function circle(x, y, r, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = CONFIG.backgroundColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Fading trail (oldest = smallest and faintest)
  trail.forEach((p, i) => {
    const t = (i + 1) / trail.length;
    circle(p.x, p.y, CONFIG.radius * t, CONFIG.ballColor, CONFIG.trailMaxAlpha * t);
  });

  circle(ball.x, ball.y + CONFIG.radius * CONFIG.shadowOffsetY, CONFIG.radius, CONFIG.shadowColor, CONFIG.shadowAlpha);
  circle(ball.x, ball.y, CONFIG.radius, CONFIG.ballColor, 1);
  circle(ball.x - CONFIG.radius * CONFIG.highlightOffset,
         ball.y - CONFIG.radius * CONFIG.highlightOffset,
         CONFIG.radius * CONFIG.highlightSize, CONFIG.highlightColor, 1);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
