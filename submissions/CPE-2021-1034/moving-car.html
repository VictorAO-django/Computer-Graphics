<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moving Car - Computer Graphics Assignment</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0712;
  }
  canvas {
    background: #f2a673;
    border: 2px solid #444;
    border-radius: 6px;
  }
</style>
</head>
<body>

<canvas id="scene" width="800" height="600"></canvas>

<script>
/* =====================================================================
 * MOVING CAR - HTML/Canvas version of moving_car.c
 * ---------------------------------------------------------------------
 * Technique: single-axis translation + respawn ("wrap-around"), exactly
 * as in the C program. Everything that depends on direction -- the sign
 * of the speed, where the car spawns, when it counts as "gone", and
 * which end gets the headlight -- is worked out from the single
 * DIRECTION value below.
 * ===================================================================== */

/* ---------------------------------------------------------------------
 *  THE SINGLE CONTROL POINT -- the only values to edit.
 *      DIRECTION   1  = the car drives from LEFT to RIGHT
 *                 -1  = the car drives from RIGHT to LEFT
 *      SPEED       how fast, in pixels per frame -- always positive;
 *                  DIRECTION gives it its sign
 *      bodyColor / cabinColor / roadColor / bgColor   any CSS colour string
 * --------------------------------------------------------------------- */
const CONFIG = {
  DIRECTION: -1,
  SPEED: 3.0,
  bodyColor:  "#e62626",   // red
  cabinColor: "#f2d933",   // yellow
  roadColor:  "#333333",   // dark gray
  bgColor:    "#f2a673",   // sunset orange
};

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

const carW = 120, carH = 40;
const carY = 150;   // measured from the bottom, flipped to canvas space when drawing
const speed = CONFIG.DIRECTION * CONFIG.SPEED;

function spawnX() {
  // appears just outside the window, on the side it is coming FROM
  return CONFIG.DIRECTION > 0 ? -carW : canvas.width;
}

function isOffScreen() {
  if (CONFIG.DIRECTION > 0) return carX > canvas.width;   // heading right: left edge passed the right wall
  return carX + carW < 0;                                  // heading left: right edge passed the left wall
}

let carX = spawnX();

// canvas Y grows downward, the C version's Y grows upward from the bottom --
// this just flips a world-Y into a canvas-Y, so the rest of the drawing code
// can still think in the same "up is positive" terms as the C file.
function toCanvasY(y) {
  return canvas.height - y;
}

function drawCircle(cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawCar(x, y) {
  const frontX = CONFIG.DIRECTION > 0 ? x + carW : x;

  // ---- body ----
  ctx.fillStyle = CONFIG.bodyColor;
  ctx.fillRect(x, toCanvasY(y + carH), carW, carH);

  // ---- cabin/roof: a trapezoid sitting on top of the body ----
  ctx.fillStyle = CONFIG.cabinColor;
  ctx.beginPath();
  ctx.moveTo(x + carW * 0.22, toCanvasY(y + carH));
  ctx.lineTo(x + carW * 0.70, toCanvasY(y + carH));
  ctx.lineTo(x + carW * 0.60, toCanvasY(y + carH + 25));
  ctx.lineTo(x + carW * 0.32, toCanvasY(y + carH + 25));
  ctx.closePath();
  ctx.fill();

  // ---- headlight: a small warm-white box on the FRONT end ----
  ctx.fillStyle = "#fffcd9";
  const hx1 = frontX;
  const hx2 = frontX - CONFIG.DIRECTION * 10;
  const left = Math.min(hx1, hx2), width = Math.abs(hx2 - hx1);
  ctx.fillRect(left, toCanvasY(y + carH * 0.85), width, carH * 0.4);

  // ---- wheels ----
  drawCircle(x + carW * 0.22, toCanvasY(y), 12, "#0d0d0d");
  drawCircle(x + carW * 0.78, toCanvasY(y), 12, "#0d0d0d");
  drawCircle(x + carW * 0.22, toCanvasY(y), 4, "#ffffff");
  drawCircle(x + carW * 0.78, toCanvasY(y), 4, "#ffffff");
}

function drawRoad() {
  ctx.fillStyle = CONFIG.roadColor;
  ctx.fillRect(0, toCanvasY(carY - 12), canvas.width, carY - 12);
}

function update() {
  carX += speed;
  if (isOffScreen()) carX = spawnX();
}

function draw() {
  ctx.fillStyle = CONFIG.bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawRoad();
  drawCar(carX, carY);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
