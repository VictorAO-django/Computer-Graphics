<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moving Car - Stylized</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #111; }
        canvas { border: 1px solid #333; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border-radius: 8px; }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        /*
         * CONFIG: Controls all tunable parameters for the animation.
         * - DIRECTION: 1 for left-to-right, -1 for right-to-left.
         * - SPEED: Positive number for how fast the car moves per frame.
         * - bodyColor, windowColor, wheelColor, roadColor: CSS colors.
         * - carWidth, carHeight, roofWidth, roofHeight, wheelRadius: Structural dimensions.
         * - carY: Vertical placement of the car's bottom edge.
         * - roadY, roadHeight: Placement and thickness of the road.
         */
        const CONFIG = {
            DIRECTION: 1,
            SPEED: 6,
            bodyColor: "#00b4d8",
            windowColor: "#caf0f8",
            wheelColor: "#1a1a1a",
            roadColor: "#2b2b2b",
            skyColorTop: "#03045e",
            skyColorBottom: "#ff9e00",
            carWidth: 160,
            carHeight: 40,
            roofWidth: 90,
            roofHeight: 35,
            wheelRadius: 20,
            carY: 450,
            roadY: 450,
            roadHeight: 150
        };

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let x = CONFIG.DIRECTION === 1 ? -CONFIG.carWidth : canvas.width;
        let roadOffset = 0;

        function update() {
            x += CONFIG.SPEED * CONFIG.DIRECTION;
            
            // Move road lines opposite to the car to increase speed illusion
            roadOffset -= (CONFIG.SPEED * 1.5) * CONFIG.DIRECTION;
            if (Math.abs(roadOffset) >= 80) roadOffset = 0;

            // Wrap-around logic
            if (CONFIG.DIRECTION === 1 && x - 100 > canvas.width) {
                x = -CONFIG.carWidth - 100;
            } else if (CONFIG.DIRECTION === -1 && x + CONFIG.carWidth + 100 < 0) {
                x = canvas.width + 100;
            }
        }

        function draw() {
            // Gradient Sky
            let skyGrad = ctx.createLinearGradient(0, 0, 0, CONFIG.roadY);
            skyGrad.addColorStop(0, CONFIG.skyColorTop);
            skyGrad.addColorStop(1, CONFIG.skyColorBottom);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, CONFIG.roadY);

            // Road & lines
            ctx.fillStyle = CONFIG.roadColor;
            ctx.fillRect(0, CONFIG.roadY, canvas.width, CONFIG.roadHeight);
            
            ctx.fillStyle = "#ffb703";
            for(let i = -1; i < canvas.width / 80 + 2; i++) {
                ctx.fillRect((i * 80) + roadOffset, CONFIG.roadY + 70, 40, 6);
            }

            // Headlight Beam
            const isFacingRight = CONFIG.DIRECTION === 1;
            const frontX = isFacingRight ? x + CONFIG.carWidth : x;
            
            let beamGrad = ctx.createLinearGradient(frontX, CONFIG.carY - 20, frontX + (isFacingRight ? 300 : -300), CONFIG.carY);
            beamGrad.addColorStop(0, "rgba(255, 255, 200, 0.6)");
            beamGrad.addColorStop(1, "rgba(255, 255, 200, 0)");
            
            ctx.beginPath();
            ctx.moveTo(frontX, CONFIG.carY - 25);
            ctx.lineTo(frontX + (isFacingRight ? 400 : -400), CONFIG.carY - 60);
            ctx.lineTo(frontX + (isFacingRight ? 400 : -400), CONFIG.carY + 20);
            ctx.lineTo(frontX, CONFIG.carY - 5);
            ctx.fillStyle = beamGrad;
            ctx.fill();
            ctx.closePath();

            // Car Shadow
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.beginPath();
            ctx.ellipse(x + CONFIG.carWidth/2, CONFIG.carY + 5, CONFIG.carWidth/2 + 10, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Car Roof & Windows
            const roofX = x + (CONFIG.carWidth - CONFIG.roofWidth) / 2;
            const roofY = CONFIG.carY - CONFIG.carHeight - CONFIG.roofHeight;
            
            ctx.fillStyle = CONFIG.bodyColor;
            ctx.beginPath();
            ctx.roundRect(roofX, roofY, CONFIG.roofWidth, CONFIG.roofHeight, [10, 10, 0, 0]);
            ctx.fill();

            // Windows
            ctx.fillStyle = CONFIG.windowColor;
            const windowMargin = 4;
            ctx.fillRect(roofX + windowMargin, roofY + windowMargin, (CONFIG.roofWidth / 2) - windowMargin*1.5, CONFIG.roofHeight - windowMargin);
            ctx.fillRect(roofX + (CONFIG.roofWidth / 2) + windowMargin/2, roofY + windowMargin, (CONFIG.roofWidth / 2) - windowMargin*1.5, CONFIG.roofHeight - windowMargin);

            // Car Body
            ctx.fillStyle = CONFIG.bodyColor;
            ctx.beginPath();
            ctx.roundRect(x, CONFIG.carY - CONFIG.carHeight, CONFIG.carWidth, CONFIG.carHeight, [8, 8, 8, 8]);
            ctx.fill();

            // Headlight/Taillight hardware
            ctx.fillStyle = isFacingRight ? "#ffff99" : "#ff3333";
            ctx.fillRect(x + CONFIG.carWidth - 5, CONFIG.carY - 25, 5, 15);
            ctx.fillStyle = isFacingRight ? "#ff3333" : "#ffff99";
            ctx.fillRect(x, CONFIG.carY - 25, 5, 15);

            // Wheels and rims
            const wheelOffset1 = CONFIG.carWidth * 0.2;
            const wheelOffset2 = CONFIG.carWidth * 0.8;

            [wheelOffset1, wheelOffset2].forEach(offsetX => {
                // Tire
                ctx.beginPath();
                ctx.arc(x + offsetX, CONFIG.carY, CONFIG.wheelRadius, 0, Math.PI * 2);
                ctx.fillStyle = CONFIG.wheelColor;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#000";
                ctx.stroke();
                ctx.closePath();

                // Rim
                ctx.beginPath();
                ctx.arc(x + offsetX, CONFIG.carY, CONFIG.wheelRadius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = "#bbb";
                ctx.fill();
                ctx.closePath();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
