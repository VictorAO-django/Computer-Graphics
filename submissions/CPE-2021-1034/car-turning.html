<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating Car</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #09090d;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- Lets the module script below use `import * as THREE from 'three'`
       without a build step. Needs an internet connection to load Three.js. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three'

    // ------------------------------------------------------------------
    // createCar  (was ./Scenes/rotatingCar.js; `export` removed because
    // it now lives in the same script as the scene code)
    // ------------------------------------------------------------------

    // Function for creating our car
    function createCar(THREE) {

      // Create a group to hold all the car components
      const car = new THREE.Group()

      // Create the car body material
      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: 0x344f68,
        metalness: 0.65,
        roughness: 0.28
      })

      // Create the main body geometry
      const bodyGeometry = new THREE.BoxGeometry(3, 0.7, 1.4)

      // Create the body mesh
      const body = new THREE.Mesh(bodyGeometry, bodyMaterial)

      // Add the body to the car group
      car.add(body)

      // Create the cabin material
      const cabinMaterial = bodyMaterial

      // Define cabin vertices
      const cabinVertices = new Float32Array([
        // Front face
        -0.95, 0, 0.6,
         0.95, 0, 0.6,
         0.25, 0.65, 0.6,
        -0.45, 0.65, 0.6,

        // Back face
        -0.95, 0, -0.6,
         0.95, 0, -0.6,
         0.25, 0.65, -0.6,
        -0.45, 0.65, -0.6
      ])

      const cabinGeometry = new THREE.BufferGeometry()

      cabinGeometry.setAttribute(
        'position',
        new THREE.BufferAttribute(cabinVertices, 3)
      )

      cabinGeometry.setIndex([
        0, 1, 2, 0, 2, 3,
        4, 6, 5, 4, 7, 6,
        0, 4, 5, 0, 5, 1,
        3, 2, 6, 3, 6, 7,
        0, 3, 7, 0, 7, 4,
        1, 5, 6, 1, 6, 2
      ])

      cabinGeometry.computeVertexNormals()

      // Create the cabin mesh
      const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial)

      // Position the cabin
      cabin.position.set(0.1, 0.3, 0)

      // Add the cabin to the car group
      car.add(cabin)

      // Create wheel material
      const wheelMaterial = new THREE.MeshStandardMaterial({
        color: 0x222222
      })

      // Create wheel geometry
      const wheelGeometry = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 32)

      // Rotate the wheels to face sideways
      wheelGeometry.rotateX(Math.PI / 2)

      // Define the four wheel positions
      const wheelPositions = [
        [-1, -0.35, 0.75],
        [1, -0.35, 0.75],
        [-1, -0.35, -0.75],
        [1, -0.35, -0.75]
      ]

      // Create and position each wheel
      wheelPositions.forEach((position) => {
        const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial)

        wheel.position.set(...position)

        car.add(wheel)
      })

      // Create window material
      const windowMaterial = new THREE.MeshStandardMaterial({
        color: 0x182b3a,
        metalness: 0.25,
        roughness: 0.15,
        transparent: true,
        opacity: 0.85
      })

      // Create mirror support material
      const mirrorSupportMaterial = new THREE.MeshStandardMaterial({
        color: 0x333333
      })

      // Create mirror housing geometry
      const mirrorGeometry = new THREE.SphereGeometry(1, 20, 16)

      // Create mirror support geometry
      const supportGeometry = new THREE.BoxGeometry(0.07, 0.07, 0.18)

      // Left mirror support
      const leftSupport = new THREE.Mesh(
        supportGeometry,
        mirrorSupportMaterial
      )

      leftSupport.position.set(0.45, 0.65, 0.66)
      car.add(leftSupport)

      // Left mirror housing
      const leftMirror = new THREE.Mesh(mirrorGeometry, bodyMaterial)

      leftMirror.position.set(0.45, 0.72, 0.78)
      leftMirror.scale.set(0.16, 0.09, 0.12)
      car.add(leftMirror)

      // Right mirror support
      const rightSupport = new THREE.Mesh(
        supportGeometry,
        mirrorSupportMaterial
      )

      rightSupport.position.set(0.45, 0.65, -0.66)
      car.add(rightSupport)

      // Right mirror housing
      const rightMirror = new THREE.Mesh(mirrorGeometry, bodyMaterial)

      rightMirror.position.set(0.45, 0.72, -0.78)
      rightMirror.scale.set(0.16, 0.09, 0.12)
      car.add(rightMirror)

      // Create headlight material
      const lightMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffffff,
        emissiveIntensity: 1.5,
        roughness: 0.2
      })

      // Create headlight geometry
      const lightGeometry = new THREE.BoxGeometry(0.15, 0.18, 0.1)

      // Left headlight
      const leftHeadlight = new THREE.Mesh(lightGeometry, lightMaterial)
      leftHeadlight.position.set(1.52, -0.05, 0.4)
      car.add(leftHeadlight)

      // Right headlight
      const rightHeadlight = new THREE.Mesh(lightGeometry, lightMaterial)
      rightHeadlight.position.set(1.52, -0.05, -0.4)
      car.add(rightHeadlight)

      // Create front grille material
      const grilleMaterial = new THREE.MeshStandardMaterial({
        color: 0x15191d,
        metalness: 0.4,
        roughness: 0.5
      })

      // Create front grille geometry
      const grilleGeometry = new THREE.BoxGeometry(0.08, 0.3, 0.65)

      // Create front grille mesh
      const frontGrille = new THREE.Mesh(
        grilleGeometry,
        grilleMaterial
      )

      // Position the grille at the front of the car
      frontGrille.position.set(1.54, -0.02, 0)

      // Add grille to car
      car.add(frontGrille)

      // Create rear light material
      const rearLightMaterial = new THREE.MeshStandardMaterial({
        color: 0xff0000,
        emissive: 0xff0000,
        emissiveIntensity: 0.4
      })

      // Create rear light geometry
      const rearLightGeometry = new THREE.BoxGeometry(0.15, 0.18, 0.1)

      // Left rear light
      const leftRearLight = new THREE.Mesh(rearLightGeometry, rearLightMaterial)
      leftRearLight.position.set(-1.52, -0.05, 0.4)
      car.add(leftRearLight)

      // Right rear light
      const rightRearLight = new THREE.Mesh(rearLightGeometry, rearLightMaterial)
      rightRearLight.position.set(-1.52, -0.05, -0.4)
      car.add(rightRearLight)

      // Create bumper material
      const bumperMaterial = new THREE.MeshStandardMaterial({
        color: 0x555555
      })

      // Create bumper geometry
      const bumperGeometry = new THREE.BoxGeometry(0.15, 0.2, 1.3)

      // Front bumper
      const frontBumper = new THREE.Mesh(bumperGeometry, bumperMaterial)
      frontBumper.position.set(1.55, -0.2, 0)
      car.add(frontBumper)

      // Rear bumper
      const rearBumper = new THREE.Mesh(bumperGeometry, bumperMaterial)
      rearBumper.position.set(-1.55, -0.2, 0)
      car.add(rearBumper)

      return car
    }

    // ------------------------------------------------------------------
    // Scene  (was src/carMain.js)
    // ------------------------------------------------------------------

    // Create the scene
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0xc9d6df)

    // Create the camera
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    )
    camera.position.set(5, 3.5, 6)
    camera.lookAt(0, 0, 0)

    // Create the car
    const car = createCar(THREE)
    scene.add(car)

    // Create the ground
    const groundGeometry = new THREE.PlaneGeometry(20, 20)
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x999999,
      roughness: 0.9
    })
    const ground = new THREE.Mesh(groundGeometry, groundMaterial)
    ground.rotation.x = -Math.PI / 2
    ground.position.y = -0.72
    scene.add(ground)

    // Allow the car to cast and receive shadows
    car.traverse((part) => {
      if (part.isMesh) {
        part.castShadow = true
        part.receiveShadow = true
      }
    })
    ground.receiveShadow = true

    // Add lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 2)
    scene.add(ambientLight)

    const directionalLight = new THREE.DirectionalLight(0xffffff, 3)
    directionalLight.position.set(5, 5, 5)
    directionalLight.castShadow = true
    scene.add(directionalLight)

    // Create the renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.shadowMap.enabled = true
    renderer.shadowMap.type = THREE.PCFSoftShadowMap
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(window.devicePixelRatio)
    renderer.setClearColor(0xc9d6df)
    document.body.appendChild(renderer.domElement)

    // Animation function
    function animate() {
      requestAnimationFrame(animate)
      car.rotation.y += 0.01
      renderer.render(scene, camera)
    }
    animate()

    // Adjust the display when the browser is resized
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })
  </script>
</body>
</html>
