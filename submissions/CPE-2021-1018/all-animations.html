<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unified Scene Animation</title>
<style>
    body {
        margin: 0;
        background: #090e17;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    canvas {
        display: block;
        width: 100%;
        max-width: 800px;
        background: #0b1340;
        border: 1px solid #333;
        border-radius: 8px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
</style>
</head>
<body>

<canvas id="scene" width="800" height="500"></canvas>

<script>
    /* =====================================================================
     * CONFIG: The single control point for the entire animation.
     * Tune colors, speeds, sizes, and physics here.
     * ===================================================================== */
    const CONFIG = {
        // Environment
        skyTop: "#0b1340",
        skyBottom: "#e8799f",
        groundColor: "#1f7a4d",
        roadColor: "#2b2e38",
        laneColor: "#e5e7eb",
        horizonY: 350,

        // Car
        carSpeed: 3.5,
        carBodyColor: "#e63946",
        carRoofColor: "#f6a623",
        carWindowColor: "#bfe3f7",
        carRimColor: "#d1d5db",
        carY: 410,

        // Bouncing Ball Physics (Perpetual Bounce)
        ballRadius: 28,
        gravity: 0.25,
        bounceVelocity: -11.5, // Constant upward kick on impact ensures it never stops bouncing
        ballStartX: 500,

        // Moon
        moonRadius: 45,
        moonSpeed: 0.012,
        moonColor: "#f3efe0",
        moonCraterColor: "#a9a28f",
        moonX: 650,
        moonY: 130,
        
        // Stars
        starCount: 40
    };

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    // Dynamic State Variables
    let carX = -120;
    let ballX = CONFIG.ballStartX;
    let ballY = 100;
    let ballVelY = 0;
    let moonAngle = 0;
    let laneOffset = 0;
    let starOffset = 0;
    let frameCount = 0;

    // Initialize random stars
    const stars = Array.from({ length: CONFIG.starCount }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * CONFIG.horizonY,
        twinkleSpeed: Math.random() * 0.05 + 0.02,
        twinkleOffset: Math.random() * Math.PI * 2,
        size: Math.random() * 1.5 + 0.5
    }));

    function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function drawEnvironment() {
        const skyGradient = ctx.createLinearGradient(0, 0, 0, CONFIG.horizonY);
        skyGradient.addColorStop(0, CONFIG.skyTop);
        skyGradient.addColorStop(1, CONFIG.skyBottom);
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, CONFIG.horizonY);

        for (const s of stars) {
            let drawX = (s.x + starOffset) % canvas.width;
            if (drawX < 0) drawX += canvas.width;
            
            const twinkle = 0.5 + 0.5 * Math.sin(frameCount * s.twinkleSpeed + s.twinkleOffset);
            ctx.fillStyle = `rgba(255, 255, 255, ${0.2 + twinkle * 0.8})`;
            ctx.beginPath();
            ctx.arc(drawX, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        }

        const ground = ctx.createLinearGradient(0, CONFIG.horizonY, 0, canvas.height);
        ground.addColorStop(0, CONFIG.groundColor);
        ground.addColorStop(1, "#14532d");
        ctx.fillStyle = ground;
        ctx.fillRect(0, CONFIG.horizonY, canvas.width, canvas.height - CONFIG.horizonY);

        const roadY = CONFIG.horizonY + 45;
        const roadHeight = 85;
        ctx.fillStyle = CONFIG.roadColor;
        ctx.fillRect(0, roadY, canvas.width, roadHeight);

        ctx.fillStyle = CONFIG.laneColor;
        const dashW = 70, gapW = 60, period = dashW + gapW;
        for (let x = -period; x < canvas.width + period; x += period) {
            ctx.fillRect(x + laneOffset, roadY + roadHeight / 2 - 3, dashW, 6);
        }
    }

    function drawMoon() {
        ctx.save();
        ctx.translate(CONFIG.moonX, CONFIG.moonY);

        const halo = ctx.createRadialGradient(0, 0, CONFIG.moonRadius * 0.8, 0, 0, CONFIG.moonRadius * 3);
        halo.addColorStop(0, "rgba(255, 250, 220, 0.4)");
        halo.addColorStop(1, "rgba(255, 250, 220, 0)");
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(0, 0, CONFIG.moonRadius * 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.rotate(moonAngle);

        const sphere = ctx.createRadialGradient(
            -CONFIG.moonRadius * 0.35, -CONFIG.moonRadius * 0.35, CONFIG.moonRadius * 0.1,
            0, 0, CONFIG.moonRadius
        );
        sphere.addColorStop(0, "#ffffff");
        sphere.addColorStop(0.55, CONFIG.moonColor);
        sphere.addColorStop(1, CONFIG.moonCraterColor);
        ctx.fillStyle = sphere;
        ctx.beginPath();
        ctx.arc(0, 0, CONFIG.moonRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = CONFIG.moonCraterColor;
        ctx.beginPath(); ctx.arc(-15, -10, 9, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(15, 15, 12, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(18, -20, 6, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = "rgba(0,0,0,0.15)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -CONFIG.moonRadius);
        ctx.stroke();

        ctx.restore();
    }

    function drawAlloyWheel(cx, cy) {
        ctx.fillStyle = "#111827";
        ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = CONFIG.carRimColor;
        ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = CONFIG.carRimColor;
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
            const a = (Math.PI * 2 / 5) * i + moonAngle * 4; 
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(a) * 7, cy + Math.sin(a) * 7);
            ctx.stroke();
        }
    }

    function drawCar(x, y) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
        ctx.beginPath();
        ctx.ellipse(x + 50, y + 40, 60, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        const body = ctx.createLinearGradient(x, y - 5, x, y + 30);
        body.addColorStop(0, CONFIG.carBodyColor);
        body.addColorStop(1, "#8a1622");
        ctx.fillStyle = body;
        roundRect(x, y, 105, 30, 8);
        ctx.fill();

        ctx.fillStyle = CONFIG.carRoofColor;
        roundRect(x + 22, y - 22, 55, 25, 7);
        ctx.fill();

        ctx.fillStyle = CONFIG.carWindowColor;
        roundRect(x + 28, y - 17, 18, 15, 3); ctx.fill();
        roundRect(x + 50, y - 17, 20, 15, 3); ctx.fill();

        const beam = ctx.createLinearGradient(x + 102, y + 10, x + 300, y + 10);
        beam.addColorStop(0, "rgba(255, 246, 201, 0.6)");
        beam.addColorStop(1, "rgba(255, 246, 201, 0)");
        ctx.fillStyle = beam;
        ctx.beginPath();
        ctx.moveTo(x + 102, y + 5);
        ctx.lineTo(x + 300, y - 10);
        ctx.lineTo(x + 300, y + 35);
        ctx.lineTo(x + 102, y + 15);
        ctx.fill();

        ctx.fillStyle = "#fff6c9";
        ctx.beginPath();
        ctx.arc(x + 102, y + 10, 4.5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = "#ff0000";
        ctx.fillRect(x, y + 5, 4, 12);

        drawAlloyWheel(x + 25, y + 30);
        drawAlloyWheel(x + 80, y + 30);
    }

    function drawBall(x, y) {
        const groundY = CONFIG.horizonY - CONFIG.ballRadius; 
        
        // Ground drop shadow
        const heightRatio = Math.max(0, 1 - ((groundY - y) / 180));
        ctx.fillStyle = `rgba(0, 0, 0, ${0.5 * heightRatio})`;
        ctx.beginPath();
        ctx.ellipse(x, groundY + CONFIG.ballRadius + 5, CONFIG.ballRadius * 0.9 * heightRatio, (CONFIG.ballRadius * 0.3) * heightRatio, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(x, y);

        // Solid basketball orange with a subtle 3D lighting gradient (No neon/glow)
        const shade = ctx.createRadialGradient(-CONFIG.ballRadius * 0.3, -CONFIG.ballRadius * 0.3, 0, 0, 0, CONFIG.ballRadius);
        shade.addColorStop(0, "#ff9900");
        shade.addColorStop(0.7, "#cc5200");
        shade.addColorStop(1, "#662900");
        ctx.fillStyle = shade;
        
        ctx.beginPath();
        ctx.arc(0, 0, CONFIG.ballRadius, 0, Math.PI * 2);
        ctx.fill();

        // Realistic Basketball Lines
        ctx.strokeStyle = "#1a0a00";
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";

        // Vertical line
        ctx.beginPath(); 
        ctx.moveTo(0, -CONFIG.ballRadius); 
        ctx.lineTo(0, CONFIG.ballRadius); 
        ctx.stroke();
        
        // Horizontal line
        ctx.beginPath(); 
        ctx.moveTo(-CONFIG.ballRadius, 0); 
        ctx.lineTo(CONFIG.ballRadius, 0); 
        ctx.stroke();
        
        // Left curve
        ctx.beginPath(); 
        ctx.arc(-CONFIG.ballRadius * 0.7, 0, CONFIG.ballRadius * 0.82, -Math.PI/2.3, Math.PI/2.3); 
        ctx.stroke();
        
        // Right curve
        ctx.beginPath(); 
        ctx.arc(CONFIG.ballRadius * 0.7, 0, CONFIG.ballRadius * 0.82, Math.PI - Math.PI/2.3, Math.PI + Math.PI/2.3); 
        ctx.stroke();

        ctx.restore();
    }

    function update() {
        frameCount++;

        carX += CONFIG.carSpeed;
        if (carX > canvas.width + 100) {
            carX = -150;
        }

        starOffset -= (CONFIG.carSpeed * 0.08);

        // Perpetual Ball Physics
        ballVelY += CONFIG.gravity;
        ballY += ballVelY;
        
        const floorY = CONFIG.horizonY - CONFIG.ballRadius;
        if (ballY > floorY) {
            ballY = floorY;
            // Using a constant kick velocity instead of a fractional multiplier guarantees it keeps bouncing forever
            ballVelY = CONFIG.bounceVelocity; 
        }

        moonAngle += CONFIG.moonSpeed;

        laneOffset -= CONFIG.carSpeed;
        const period = 130;
        if (laneOffset <= -period) {
            laneOffset += period;
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawEnvironment();
        drawMoon();
        drawBall(ballX, ballY);
        drawCar(carX, CONFIG.carY);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
