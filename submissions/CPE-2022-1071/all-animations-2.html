<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D CSS Animations</title><style>*{box-sizing:border-box;margin:0}
body{background:#080a10}
.stage{position:relative;height:540px;overflow:hidden;perspective:1000px;perspective-origin:50% 35%;--s:1;border-bottom:2px solid #000}
.s1{background:linear-gradient(#2b3a67,#c9825b 130%)}
.s2{background:linear-gradient(#10172b,#4a2f58 130%)}
.s3{background:radial-gradient(ellipse at 50% 12%,#2c3558,#0a0c14 70%)}
.world{position:absolute;left:50%;top:68%;transform-style:preserve-3d;transform:scale(var(--s)) rotateX(-22deg)}
.g{position:absolute;left:0;top:0;transform-style:preserve-3d}
.c{position:absolute;width:var(--w);height:var(--h);margin:calc(var(--h)*-1) 0 0 calc(var(--w)/-2);transform-style:preserve-3d}
.c i{position:absolute;left:0;top:0;background:var(--c);backface-visibility:hidden}
.c i:nth-child(1){width:100%;height:100%;transform:translateZ(calc(var(--d)/2))}
.c i:nth-child(2){width:100%;height:100%;transform:rotateY(180deg) translateZ(calc(var(--d)/2));filter:brightness(.7)}
.c i:nth-child(3){width:var(--d);height:100%;left:calc((var(--w) - var(--d))/2);transform:rotateY(90deg) translateZ(calc(var(--w)/2));filter:brightness(.85)}
.c i:nth-child(4){width:var(--d);height:100%;left:calc((var(--w) - var(--d))/2);transform:rotateY(-90deg) translateZ(calc(var(--w)/2));filter:brightness(.6)}
.c i:nth-child(5){width:100%;height:var(--d);top:calc((var(--h) - var(--d))/2);transform:rotateX(90deg) translateZ(calc(var(--h)/2));filter:brightness(1.15)}
.c i:nth-child(6){width:100%;height:var(--d);top:calc((var(--h) - var(--d))/2);transform:rotateX(-90deg) translateZ(calc(var(--h)/2));filter:brightness(.5)}
.floor{position:absolute;left:0;top:0;width:var(--fw);height:var(--fh);margin:calc(var(--fh)/-2) 0 0 calc(var(--fw)/-2);border-radius:var(--br,50%);transform:translateY(1px) rotateX(90deg)}
.floor:not(.wide)::after{content:"";position:absolute;left:calc(50% - 170px);top:calc(50% - 170px);width:340px;height:340px;border:3px dashed var(--ring);border-radius:50%}
.sh{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(#000a,transparent 70%);transform:rotateX(90deg)}
.spin{animation:spin var(--t) linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.bob{animation:bob .22s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.look{animation:look 2.4s ease-in-out infinite}
@keyframes look{0%,100%{transform:rotateZ(-5deg) rotateX(4deg)}50%{transform:rotateZ(5deg) rotateX(-3deg)}}
.wag{animation:wag 1s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotateZ(-24deg)}50%{transform:rotateZ(24deg)}}
.roll{animation:roll .39s linear infinite}
@keyframes roll{to{transform:rotateZ(360deg)}}
.roll i{position:absolute;width:22px;height:22px;margin:-11px;border-radius:50%;background:#15161a;border:2px solid #0b0b0d}
.roll i:nth-child(1){transform:translateZ(-3px);background:repeating-conic-gradient(#8b8f9a 0 15deg,#15161a 15deg 60deg)}
.roll i:nth-child(3){transform:translateZ(3px);background:repeating-conic-gradient(#8b8f9a 0 15deg,#15161a 15deg 60deg)}
.glow i{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.7)}}
/* scene 3 */
.cam{animation:cam 20s ease-in-out infinite}
@keyframes cam{0%,100%{transform:scale(var(--s)) rotateX(-14deg) rotateY(-20deg)}45%{transform:scale(var(--s)) rotateX(-12deg) rotateY(4deg) translateZ(40px)}60%{transform:scale(var(--s)) rotateX(-10deg) rotateY(8deg) translateZ(110px)}85%{transform:scale(var(--s)) rotateX(-14deg) rotateY(-6deg)}}
.rstep{animation:rstep 20s ease-in-out infinite}
@keyframes rstep{0%,62%{transform:translate3d(0,0,0) rotateY(55deg)}68%{transform:translate3d(10px,-6px,0) rotateY(55deg)}74%{transform:translate3d(18px,0,0) rotateY(55deg)}90%{transform:translate3d(18px,0,0) rotateY(55deg)}98%{transform:translate3d(0,0,0) rotateY(55deg)}}
.nod{animation:nod 20s ease-in-out infinite}
@keyframes nod{0%,22%{transform:rotateX(0)}30%,45%{transform:rotateX(-26deg)}55%,100%{transform:rotateX(0)}}
.tilt{animation:tilt 20s ease-in-out infinite}
@keyframes tilt{0%,4%{transform:rotateZ(0)}9%,22%{transform:rotateZ(12deg)}30%,100%{transform:rotateZ(0)}}
.reach{animation:reach 20s ease-in-out infinite}
@keyframes reach{0%,44%{transform:rotateX(0)}50%,62%{transform:rotateX(85deg)}70%,100%{transform:rotateX(0)}}
.dim i{animation:dim 20s ease-in-out infinite}
@keyframes dim{0%,24%{opacity:1}30%,46%{opacity:.2}54%,100%{opacity:1}}
.spark i{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.spot{position:absolute;left:50%;top:0;width:620px;height:100%;transform:translateX(-50%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);background:linear-gradient(rgba(255,235,190,.3),rgba(255,235,190,.03));animation:sp 5s ease-in-out infinite alternate}
@keyframes sp{to{opacity:.6}}
.rain{position:absolute;inset:-25%;transform:rotate(14deg);pointer-events:none;opacity:.8}
.rain::before,.rain::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 31px,#a9c7ff 31px 33px);-webkit-mask:repeating-linear-gradient(180deg,#000 0 26px,transparent 26px 90px);mask:repeating-linear-gradient(180deg,#000 0 26px,transparent 26px 90px);animation:f1 .6s linear infinite}

@keyframes f1{to{-webkit-mask-position:0 90px;mask-position:0 90px}}
@keyframes f2{to{-webkit-mask-position:0 130px;mask-position:0 130px}}
.flash,.bolt{position:absolute;opacity:0;pointer-events:none;animation:fl 20s linear infinite}
.flash{inset:0;background:#cfe0ff;mix-blend-mode:screen}
.bolt{left:12%;top:0;width:70px;height:60%;background:#fff;clip-path:polygon(55% 0,20% 48%,48% 48%,30% 100%,85% 38%,55% 38%,80% 0)}
@keyframes fl{0%,24.5%{opacity:0}25%{opacity:.85}25.6%{opacity:.1}26.2%{opacity:.7}28%,100%{opacity:0}}
.bub{position:absolute;top:44px;width:140px;height:100px;border-radius:28px;background:#fff;display:grid;place-items:center;transform:scale(0);opacity:0;animation:pop 20s linear infinite backwards;box-shadow:0 0 30px #fff3}
.bub::after{content:"";position:absolute;bottom:-14px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
.h{left:calc(50% + 30px);transform-origin:20% 100%}.h::after{left:22px}
.r{left:calc(50% - 170px);transform-origin:80% 100%}.r::after{right:22px}
@keyframes pop{0%{transform:scale(0) translateY(20px);opacity:0}2.5%{transform:scale(1.08);opacity:1}4%,16%{transform:scale(1);opacity:1}18%,100%{transform:scale(.6);opacity:0}}
.q{position:relative;width:30px;height:54px}
.q::before{content:"";position:absolute;left:0;top:0;width:30px;height:30px;border:7px solid #1d2230;border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(10deg)}
.q s{position:absolute;left:12px;top:24px;width:7px;height:14px;background:#1d2230}
.q::after{content:"";position:absolute;left:11px;top:44px;width:9px;height:9px;border-radius:50%;background:#1d2230}
.cl{position:relative;margin-top:16px;width:58px;height:24px;background:#6b7a99;border-radius:24px}
.cl::before,.cl::after{content:"";position:absolute;border-radius:50%;background:#6b7a99}
.cl::before{width:28px;height:28px;top:-14px;left:8px}.cl::after{width:34px;height:34px;top:-20px;left:22px}
.cl s{position:absolute;top:30px;width:3px;height:11px;background:#3ab8ff;animation:drip .7s linear infinite}
.cl s:nth-child(1){left:14px}.cl s:nth-child(2){left:28px;animation-delay:.25s}.cl s:nth-child(3){left:42px;animation-delay:.45s}
@keyframes drip{from{transform:translateY(-6px);opacity:1}to{transform:translateY(20px);opacity:0}}
.ht{position:relative;width:30px;height:30px;background:#ff4d6d;transform:rotate(-45deg);animation:beat .8s ease-in-out infinite}
.ht::before,.ht::after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:#ff4d6d}
.ht::before{top:-15px;left:0}.ht::after{left:15px;top:0}
@keyframes beat{50%{transform:rotate(-45deg) scale(1.18)}}
.sun{position:relative;width:40px;height:40px;border-radius:50%;background:#ffd23f;box-shadow:0 0 26px #ffb703}
.sun::before{content:"";position:absolute;inset:-12px;border:5px dotted #ffc61a;border-radius:50%;animation:rot 6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.n{position:absolute;left:16px;top:16px;display:flex;gap:6px;z-index:3}
.n s{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.85}
@media(max-width:640px){.stage{--s:.75;height:480px}.bub{width:120px;height:88px}.h{left:calc(50% + 20px)}.r{left:calc(50% - 140px)}}
</style></head><body>
