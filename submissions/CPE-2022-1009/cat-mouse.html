
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cat and Mouse Animation</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #182438;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.scene {
    width: 600px;
    height: 450px;
    background: #263b50;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
}

.cat {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 100px;
    z-index: 2;
}

.orbit {
    position: absolute;
    width: 280px;
    height: 280px;
    top: 50%;
    left: 50%;
    margin-left: -140px;
    margin-top: -140px;
    border-radius: 50%;
    animation: rotate 5s linear infinite;
}

.mouse {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 42px;
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="cat">🐈</div>

    <div class="orbit">
        <div class="mouse">🐁</div>
    </div>

</div>

</body>
</html>
