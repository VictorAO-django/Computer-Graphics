<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group 6 — Assignment Submissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Poppins', sans-serif; }
  button, input { font-family: inherit; }
  button:focus-visible, input:focus-visible {
    outline: 3px solid rgba(37, 99, 235, .35);
    outline-offset: 2px;
  }

  /* Mobile default: sidebar (list) shown, main (detail) hidden. Once a student is
     picked, body gets "showing-detail" which swaps that. Desktop (lg+): sidebar is a
     fixed-width, full-height column and main always fills the rest, regardless. */
  #mainPanel { display: none; }
  body.showing-detail #sidebar { display: none; }
  body.showing-detail #mainPanel { display: flex; }

  @media (min-width: 1024px) {
    #sidebar, #mainPanel,
    body.showing-detail #sidebar, body.showing-detail #mainPanel {
      display: flex !important;
    }
    #sidebar { height: 100%; position: sticky; top: 0; }
    #mainPanel { height: 100%; overflow-y: auto; }
  }

  /* the iframe is scaled with a transform when the wrapper is narrower than its
     real content — see fitIframe() below */
  #viewerFrame { transform-origin: top left; }

  /* custom scrollbar: light gray track, medium gray thumb */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: #f5f5f5; }
  ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 9999px; border: 2px solid #f5f5f5; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #a3a3a3; background-clip: padding-box; }
  * { scrollbar-width: thin; scrollbar-color: #d4d4d4 #f5f5f5; }

  /* segmented-control tabs for switching between a student's animations */
  .seg-tab {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 0.75rem;
    font-size: 0.875rem; font-weight: 500; text-align: center;
    transition: background-color .15s ease, color .15s ease;
  }
  .seg-tab.active { background: #2563eb; color: #fff; }
  .seg-tab.inactive { color: #737373; }
  .seg-tab.inactive:hover { background: #e5e7eb; color: #262626; }
</style>
</head>
<body class="min-h-screen bg-neutral-200 text-neutral-900">

  <div id="root"></div>

  <!--
    ====================================================================
    WHERE TO EDIT WHAT (read this before diving into the script below)
    ====================================================================
    - Colours, spacing, roundedness, fonts -> Tailwind classes in the
      templates below (they read like plain HTML with ${...} for data).
    - Student list row layout            -> <StudentRow>
    - The big detail/preview panel       -> <MainPanel>
    - The pill tabs (Ball/Car/Moon)      -> <Tabs>
    - The photo-zoom popup               -> <Lightbox>
    - Avatar (photo-or-initials) circle  -> <Avatar>
    - Which file maps to which label/icon -> FILE_META, near the top
    - The iframe auto-sizing logic       -> fitIframe()  (the one bit of
      plain DOM code left, because it has to reach INTO the iframe's own
      document, which isn't something a template can express)
    ====================================================================
  -->

  <script type="module">
    import { h, render } from "https://esm.sh/preact@10.23.2";
    import { useState, useEffect, useRef } from "https://esm.sh/preact@10.23.2/hooks";
    import htm from "https://esm.sh/htm@3.1.1";
    const html = htm.bind(h);

    // ------------------------------------------------------------------
    // Icons — plain inline SVG, fully owned by Preact.
    //
    // (We used to load the lucide icon library and call lucide.createIcons()
    // to swap <i data-lucide="..."> tags for real <svg> elements. That's an
    // imperative library mutating the DOM behind Preact's back — every
    // re-render, Preact no longer recognised the <svg> lucide had swapped in
    // for its own <i> tag, so it kept inserting another one instead of
    // reusing it. That's the "chevrons kept multiplying" bug. Rendering the
    // <svg> ourselves, as a normal Preact-owned element, removes the
    // conflict entirely — add a new icon by adding its path data below.)
    // ------------------------------------------------------------------
    const ICON_PATHS = {
      search: html`<circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />`,
      x: html`<path d="M18 6 6 18" /><path d="m6 6 12 12" />`,
      users: html`<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" />`,
      "arrow-left": html`<path d="m12 19-7-7 7-7" /><path d="M19 12H5" />`,
      clock: html`<circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" />`,
      "chevron-right": html`<path d="m9 18 6-6-6-6" />`,
      moon: html`<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />`,
      "circle-dot": html`<circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="2.5" fill="currentColor" />`,
      "file-text": html`<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" />`,
      car: html`<path d="M5 17h14" /><path d="M5 17a2 2 0 1 1 0-4h.3l1.4-4.2A2 2 0 0 1 8.6 7.4h6.8a2 2 0 0 1 1.9 1.4L18.7 13h.3a2 2 0 1 1 0 4" /><circle cx="7.5" cy="17" r="1.5" /><circle cx="16.5" cy="17" r="1.5" />`,
      download: html`<path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" />`,
      cat: html`<path d="M12 5 9 2 7 5" /><path d="M12 5l3-3 2 3" /><path d="M7 5h10a4 4 0 0 1 4 4v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V9a4 4 0 0 1 4-4Z" /><path d="M9 13v.01" /><path d="M15 13v.01" /><path d="M10 17c.7.6 1.3.6 2 0" />`,
      "message-circle": html`<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />`,
      layers: html`<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.84l8.57 3.9a2 2 0 0 0 1.66 0l8.57-3.9a1 1 0 0 0 0-1.84Z" /><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" />`,
    };

    function Icon({ name, class: className = "w-4 h-4" }) {
      return html`
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" class=${className}>
          ${ICON_PATHS[name]}
        </svg>
      `;
    }

    // ------------------------------------------------------------------
    // Data helpers
    // ------------------------------------------------------------------

    // pastel fallback colours for students with no photo
    const AVATAR_COLORS = [
      "bg-indigo-50 text-indigo-700",
      "bg-amber-50 text-amber-700",
      "bg-emerald-50 text-emerald-700",
      "bg-rose-50 text-rose-700",
      "bg-sky-50 text-sky-700",
      "bg-violet-50 text-violet-700",
    ];

    // which file name maps to which short label + lucide icon on the badges/tabs
    const FILE_META = {
      "bouncing-ball": { label: "Ball", icon: "circle-dot" },
      "moving-car": { label: "Car", icon: "car" },
      "earth-orbting": { label: "Moon", icon: "moon" },
      "cat-mouse": { label: "Cat & Mouse", icon: "cat" },
      "car-turning": { label: "Car Turning", icon: "car" },
      "handicapped": { label: "Conversation", icon: "message-circle" },
      "all-animations-2": { label: "All (2)", icon: "layers" },
    };

    function colorFor(name) {
      let hash = 0;
      for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) % AVATAR_COLORS.length;
      return AVATAR_COLORS[hash];
    }

    function initials(name) {
      return name.trim().split(/\s+/).slice(0, 2).map((w) => w[0]?.toUpperCase() || "").join("");
    }

    function fileMeta(fileName) {
      const key = fileName.replace(/\.html?$/i, "").toLowerCase();
      return FILE_META[key] || { label: "File", icon: "file-text" };
    }

    function prettyFileName(fileName) {
      return fileName
        .replace(/\.html?$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    // ------------------------------------------------------------------
    // The one piece of plain-DOM logic: sizing the preview iframe to its
    // real content. These submitted pages are same-origin, so once the
    // iframe finishes loading we can read its actual rendered size and
    // match the iframe to it exactly — no scrolling, no guessed height.
    //
    // Measure at the WRAPPER's own width first — correct for any submission
    // built to be responsive (percentage widths, vw units, flex layouts),
    // which is most of them. Only if the page turns out to be genuinely
    // wider than that (e.g. a fixed-pixel canvas on a narrow screen) do we
    // shrink-wrap it and scale the whole thing down with a CSS transform,
    // so nothing crops. (Forcing every page to shrink-wrap unconditionally
    // used to collapse percentage-width layouts to near nothing, since a
    // "width:100%" child of a shrink-wrapped parent has nothing to measure
    // against — that was the truncated/blank-preview bug.)
    // ------------------------------------------------------------------
    function fitIframe(iframeEl, wrapperEl) {
      let doc;
      try { doc = iframeEl.contentDocument; } catch (e) { doc = null; }
      if (!doc || !doc.body) return;

      // Some pages use min-height:100vh on html/body, sized against the
      // IFRAME's own current height — circular when we're trying to measure
      // the page's true height, so neutralize it before measuring. Width is
      // left alone on purpose; see above.
      if (!doc.getElementById("__fitOverride")) {
        const override = doc.createElement("style");
        override.id = "__fitOverride";
        override.textContent = "html,body{min-height:0 !important;height:auto !important;}";
        doc.head.appendChild(override);
      }

      const wrapperW = wrapperEl.clientWidth;
      iframeEl.style.transform = "none";
      iframeEl.style.width = "100%";

      const naturalW = Math.max(doc.documentElement.scrollWidth, doc.body.scrollWidth);
      const contentH = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);

      if (wrapperW > 0 && naturalW > wrapperW + 1) {
        const scale = wrapperW / naturalW;
        iframeEl.style.width = naturalW + "px";
        iframeEl.style.height = contentH + "px";
        iframeEl.style.transform = `scale(${scale})`;
        wrapperEl.style.height = Math.round(contentH * scale) + "px";
      } else {
        iframeEl.style.height = contentH + "px";
        wrapperEl.style.height = "";
      }
    }

    // ------------------------------------------------------------------
    // Small shared pieces
    // ------------------------------------------------------------------

    // photo-or-initials circle. Clicking it opens the lightbox when a photo exists.
    function Avatar({ student, size, onZoom }) {
      if (student.photo) {
        const photoUrl = `submissions/${student.folder}/${student.photo}`;
        return html`
          <div
            class="${size} rounded-full overflow-hidden shrink-0 bg-neutral-100 cursor-zoom-in hover:ring-2 hover:ring-blue-400 transition"
            onClick=${(e) => { e.stopPropagation(); onZoom(photoUrl, student.name); }}
          >
            <img src=${photoUrl} alt=${student.name} class="w-full h-full object-cover" />
          </div>
        `;
      }
      return html`
        <div class="${size} rounded-full flex items-center justify-center text-sm font-semibold shrink-0 ${colorFor(student.name)}">
          ${initials(student.name)}
        </div>
      `;
    }

    function FileBadges({ files }) {
      if (files.length === 0) {
        return html`
          <span class="inline-flex items-center gap-1 text-[11px] font-medium text-amber-700 bg-amber-50 rounded px-1.5 py-0.5">
            <${Icon} name="clock" class="w-3 h-3" />Pending
          </span>
        `;
      }
      return files.map((f) => {
        const { label, icon } = fileMeta(f);
        return html`
          <span class="inline-flex items-center gap-1 text-[11px] font-medium text-neutral-600 bg-neutral-100 rounded px-1.5 py-0.5">
            <${Icon} name=${icon} class="w-3 h-3" />${label}
          </span>
        `;
      });
    }

    function StudentRow({ student, isSelected, onSelect, onZoomPhoto }) {
      return html`
        <button
          class="w-full flex items-center gap-3 px-3 py-2.5 text-left rounded-xl border transition ${
            isSelected
              ? "bg-blue-50 border-blue-200 shadow-sm"
              : "bg-white border-neutral-200 hover:-translate-y-0.5 hover:border-blue-200 hover:shadow-md"
          }"
          onClick=${onSelect}
        >
          <${Avatar} student=${student} size="w-12 h-12 shadow-sm ring-2 ring-white" onZoom=${onZoomPhoto} />
          <div class="min-w-0 flex-1">
            <p class="font-medium text-neutral-900 text-sm leading-snug">${student.name}</p>
            <p class="text-xs text-neutral-500">${student.matric}</p>
          </div>
          <${Icon} name="chevron-right" class="w-4 h-4 text-neutral-300 shrink-0" />
        </button>
      `;
    }

    function Tabs({ files, activeIndex, onSelect }) {
      return html`
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 w-full">
          ${files.map((fileName, i) => {
            const { icon } = fileMeta(fileName);
            return html`
              <button class="seg-tab ${i === activeIndex ? "active" : "inactive"}" onClick=${() => onSelect(i)}>
                <${Icon} name=${icon} class="w-3.5 h-3.5" />${prettyFileName(fileName)}
              </button>
            `;
          })}
        </div>
      `;
    }

    // the preview card: avatar/name header, tabs (if >1 file), and the auto-fitting iframe
    function PreviewCard({ student, activeFileIndex, onTabSelect, onZoomPhoto }) {
      const frameRef = useRef(null);
      const wrapperRef = useRef(null);
      const hasFiles = student.files.length > 0;
      const fileUrl = hasFiles ? `submissions/${student.folder}/${student.files[activeFileIndex]}` : null;

      return html`
        <div class="flex flex-col gap-4 bg-white border border-neutral-200 rounded-2xl p-4 lg:p-6 shadow-sm">
          <div class="flex items-center gap-3">
            <${Avatar} student=${student} size="w-11 h-11" onZoom=${onZoomPhoto} />
            <div class="min-w-0">
              <h2 class="text-base font-semibold leading-tight">${student.name}</h2>
              <p class="text-sm text-neutral-500 leading-tight">${student.matric}</p>
            </div>
          </div>

          ${hasFiles && html`
            <div class="flex flex-col items-stretch gap-3 w-full">
              ${student.files.length > 1 && html`
                <${Tabs} files=${student.files} activeIndex=${activeFileIndex} onSelect=${onTabSelect} />
              `}
              <a
                href=${fileUrl}
                download=${student.files[activeFileIndex]}
                class="self-end inline-flex items-center gap-1.5 text-sm font-medium text-neutral-600 bg-neutral-100 hover:bg-neutral-200 rounded-full px-3.5 py-2 transition shrink-0"
              >
                <${Icon} name="download" class="w-4 h-4" />
                Download
              </a>
            </div>
          `}

          ${hasFiles
            ? html`
                <div id="viewerFrameWrapper" ref=${wrapperRef} class="bg-neutral-50 rounded-xl border border-neutral-200 overflow-hidden">
                  <iframe
                    id="viewerFrame"
                    ref=${frameRef}
                    class="border-0 block"
                    src=${fileUrl}
                    onLoad=${() => fitIframe(frameRef.current, wrapperRef.current)}
                  ></iframe>
                </div>
              `
            : html`
                <div class="flex flex-col items-center justify-center text-center bg-neutral-50 border border-dashed border-neutral-300 rounded-xl py-20 text-neutral-400 text-sm gap-2">
                  <${Icon} name="clock" class="w-6 h-6" />
                  No submission yet
                </div>
              `
          }
        </div>
      `;
    }

    function MainPanel({ student, activeFileIndex, onTabSelect, onBack, onZoomPhoto }) {
      return html`
        <main id="mainPanel" class="flex-col flex-1 min-w-0 bg-gradient-to-br from-slate-50 via-neutral-100 to-blue-50">
          <div class="p-4 lg:p-8 max-w-[1100px] w-full mx-auto">
            <button
              class="lg:hidden mb-5 inline-flex items-center gap-1.5 bg-white border border-neutral-200 rounded-full pl-3 pr-4 py-2 text-sm font-medium text-neutral-600 hover:border-blue-200 hover:text-blue-700 active:scale-[0.97] transition"
              onClick=${onBack}
            >
              <${Icon} name="arrow-left" class="w-4 h-4" /> Back to list
            </button>

            <header class="mb-6 flex items-end justify-between gap-4">
              <div>
                <p class="text-xs font-semibold uppercase tracking-[.18em] text-blue-600">Group 6 · 500 Level</p>
                <h1 class="mt-1 text-2xl lg:text-3xl font-semibold tracking-tight text-neutral-900">Assignment review</h1>
                <p class="mt-1 text-sm text-neutral-500">Explore each student's Computer Graphics submissions.</p>
              </div>
              <div class="hidden sm:flex items-center gap-2 rounded-full border border-blue-100 bg-white/80 px-3 py-2 text-xs font-medium text-blue-700 shadow-sm">
                <${Icon} name="layers" class="w-4 h-4" />
                Submission hub
              </div>
            </header>

            ${student
              ? html`<${PreviewCard} student=${student} activeFileIndex=${activeFileIndex} onTabSelect=${onTabSelect} onZoomPhoto=${onZoomPhoto} />`
              : html`
                  <div class="flex flex-col items-center justify-center text-center bg-white border border-neutral-200 rounded-2xl px-6 py-20 shadow-sm">
                    <div class="w-14 h-14 rounded-2xl flex items-center justify-center bg-blue-50 text-blue-600">
                      <${Icon} name="users" class="w-7 h-7" />
                    </div>
                    <h2 class="mt-4 text-base font-semibold text-neutral-800">Choose a student</h2>
                    <p class="mt-1 max-w-sm text-sm text-neutral-500">Select a name from the list to view their submitted animations.</p>
                  </div>
                `
            }
          </div>
        </main>
      `;
    }

    function Sidebar({ students, filtered, selectedMatric, searchQuery, onSearch, onSelect, onZoomPhoto }) {
      return html`
        <aside id="sidebar" class="flex-col w-full lg:w-[340px] lg:shrink-0 bg-slate-50 lg:border-r lg:border-neutral-200 lg:overflow-y-auto">
          <div class="px-5 pt-5 pb-4 bg-white border-b border-neutral-200">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3 min-w-0">
                <div class="w-11 h-11 rounded-2xl flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-600 text-white shadow-sm">
                  <${Icon} name="users" class="w-5 h-5" />
                </div>
                <div class="min-w-0">
                  <p class="font-semibold text-xl leading-tight truncate text-neutral-900">Group 6</p>
                  <p class="text-xs text-neutral-500 leading-tight mt-1">Computer Graphics · 500 Level</p>
                </div>
              </div>
              <span class="shrink-0 rounded-full bg-blue-50 px-2.5 py-1 text-xs font-semibold text-blue-700">${students.length}</span>
            </div>

            <div class="relative mt-4">
              <${Icon} name="search" class="w-4 h-4 text-neutral-400 absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none" />
              <input
                type="text"
                aria-label="Search students by name or matric number"
                placeholder="Search name or matric number"
                value=${searchQuery}
                onInput=${(e) => onSearch(e.target.value)}
                class="w-full pl-10 pr-9 py-2.5 rounded-xl bg-slate-50 border border-neutral-200 text-sm placeholder:text-neutral-400 focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition"
              />
              ${searchQuery && html`
                <button
                  type="button"
                  aria-label="Clear search"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-600"
                  onClick=${() => onSearch("")}
                >
                  <${Icon} name="x" class="w-3.5 h-3.5" />
                </button>
              `}
            </div>
          </div>

          <div class="flex flex-col gap-2.5 p-3">
            ${filtered.map((student) => html`
              <${StudentRow}
                key=${student.matric}
                student=${student}
                isSelected=${student.matric === selectedMatric}
                onSelect=${() => onSelect(student)}
                onZoomPhoto=${onZoomPhoto}
              />
            `)}
          </div>

          ${filtered.length === 0 && html`
            <p class="mx-3 my-8 rounded-xl bg-white px-4 py-8 text-center text-sm text-neutral-500 border border-dashed border-neutral-300">No matching student found.</p>
          `}
        </aside>
      `;
    }

    function Lightbox({ photo, onClose }) {
      if (!photo) return null;
      return html`
        <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-6 cursor-zoom-out" onClick=${onClose}>
          <img src=${photo.src} alt=${photo.alt} class="max-w-full max-h-full rounded-lg" onClick=${(e) => e.stopPropagation()} />
          <button
            class="absolute top-5 right-5 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition"
            onClick=${onClose}
          >
            <${Icon} name="x" class="w-5 h-5" />
          </button>
        </div>
      `;
    }

    // ------------------------------------------------------------------
    // App
    // ------------------------------------------------------------------
    function App() {
      const [students, setStudents] = useState([]);
      const [loadError, setLoadError] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedMatric, setSelectedMatric] = useState(null);
      const [activeFileIndex, setActiveFileIndex] = useState(0);
      const [photo, setPhoto] = useState(null); // { src, alt } | null

      useEffect(() => {
        fetch("students.json")
          .then((res) => res.json())
          .then(setStudents)
          .catch(() => setLoadError(true));
      }, []);

      // mobile: swap the sidebar for the main panel; desktop: CSS keeps both visible
      useEffect(() => {
        document.body.classList.toggle("showing-detail", selectedMatric !== null);
      }, [selectedMatric]);

      const q = searchQuery.trim().toLowerCase();
      const filtered = students.filter(
        (s) => s.name.toLowerCase().includes(q) || s.matric.toLowerCase().includes(q)
      );
      const selectedStudent = students.find((s) => s.matric === selectedMatric) || null;

      function selectStudent(student) {
        setSelectedMatric(student.matric);
        setActiveFileIndex(0);
        window.scrollTo(0, 0);
      }

      function openLightbox(src, alt) {
        setPhoto({ src, alt });
      }

      if (loadError) {
        return html`<p class="text-red-600 p-4">Could not load students.json — make sure it exists next to index.html.</p>`;
      }

      return html`
        <div id="appShell" class="bg-neutral-100 lg:m-4 lg:flex lg:h-[calc(100vh-2rem)] lg:overflow-hidden lg:rounded-3xl lg:border lg:border-neutral-200 lg:shadow-xl lg:shadow-slate-300/40">
          <${Sidebar}
            students=${students}
            filtered=${filtered}
            selectedMatric=${selectedMatric}
            searchQuery=${searchQuery}
            onSearch=${setSearchQuery}
            onSelect=${selectStudent}
            onZoomPhoto=${openLightbox}
          />
          <${MainPanel}
            student=${selectedStudent}
            activeFileIndex=${activeFileIndex}
            onTabSelect=${setActiveFileIndex}
            onBack=${() => setSelectedMatric(null)}
            onZoomPhoto=${openLightbox}
          />
        </div>
        <${Lightbox} photo=${photo} onClose=${() => setPhoto(null)} />
      `;
    }

    render(html`<${App} />`, document.getElementById("root"));
  </script>

</body>
</html>
